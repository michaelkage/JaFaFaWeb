name: Finish boring activation code UI

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jafafa-boring-activation
  cancel-in-progress: true

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add activation UI to plain admin portal
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('indexboring.html')
          s = p.read_text(encoding='utf-8')

          nav = '<button onclick="showScreen(\'screen-activation-codes\')">Activation Codes</button>'
          if 'screen-activation-codes' not in s:
              anchor = '<button onclick="openAddVehicleForCustomer()">+ Vehicle</button>'
              if anchor not in s:
                  raise SystemExit('Could not find plain admin navigation anchor')
              s = s.replace(anchor, anchor + '\n        ' + nav, 1)

          if 'id="screen-activation-codes"' not in s:
              section = r'''
      <section id="screen-activation-codes" hidden>
        <div class="breadcrumb">
          <button class="btn-back" onclick="showScreen('screen-admin-dashboard')">← Dashboard</button>
        </div>
        <div class="view-header">
          <h2>Activation Codes</h2>
          <p>Provision one-time activation codes for physical JaFaFa dongles.</p>
        </div>
        <div class="management-card">
          <h3>Issue Activation Code</h3>
          <p style="color:#94a3b8;margin:.4rem 0 1rem">Generate a single-use code and write it onto the physical product package. The customer enters this code during vehicle registration.</p>
          <div class="management-actions" style="justify-content:flex-start">
            <button class="btn-action" type="button" onclick="jafafaGenerateActivationCode()">Generate One-Time Code</button>
          </div>
          <div id="activation-code-output" style="margin-top:1rem"></div>
        </div>
        <div class="management-card">
          <h3 style="margin-bottom:1rem">Activation Inventory</h3>
          <div class="table-container" style="overflow:auto">
            <table class="telemetry-table" style="min-width:900px">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th>Activated</th>
                  <th>Customer</th>
                  <th>Vehicle</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="activation-code-rows"></tbody>
            </table>
          </div>
        </div>
      </section>
'''
              marker = '      <section id="screen-telemetry" hidden>'
              if marker not in s:
                  raise SystemExit('Could not find telemetry section anchor')
              s = s.replace(marker, section + marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate plain portals
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          for filename in ('indexboring.html', 'customerboring.html'):
              text = Path(filename).read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I|re.S)
              for i, block in enumerate(blocks, 1):
                  if not block.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                      f.write(block)
                      name = f.name
                  r = subprocess.run(['node', '--check', name], capture_output=True, text=True)
                  if r.returncode:
                      print(r.stderr)
                      raise SystemExit(f'JavaScript syntax error in {filename}, block {i}')
              print(f'Validated {filename}')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indexboring.html
          git rm -f .github/workflows/finalize-boring-activation.yml
          git commit -m 'Add activation code manager to plain admin portal'
          git push origin HEAD:main
