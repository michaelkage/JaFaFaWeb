name: Verify dashboard enhancements

on:
  push:
    branches: [feat/dashboard-telemetry-ux]

# The enhancement module is inlined directly in index.html, so this workflow
# only validates the markup. It intentionally holds no write permissions and
# does not commit back to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          if '</body>' not in text:
              raise SystemExit('index.html has no closing body tag')
          PY
