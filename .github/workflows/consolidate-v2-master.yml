name: Consolidate JaFaFaWeb 2.0 Master Plan
on:
  push:
    paths:
      - '.jafafa-install-v2-master'
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate master customer/admin integration into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          js = Path('jafafa-v2-master.js').read_text(encoding='utf-8')
          marker = 'JaFaFaWeb 2.0 — Plans 1–6 integration layer.'
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('No </body> tag found')
              text = text.replace('</body>', '<script>\n' + js + '\n</script>\n</body>', 1)
              p.write_text(text, encoding='utf-8')
      - name: Validate consolidated HTML
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['JaFaFaWeb 2.0 — Plans 1–6 integration layer.','JaFaFaPlatform','jafafa_vehicle_claims_v1','Access Requests']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('Invalid html document boundary')
      - name: Remove temporary source and trigger files
        run: rm -f jafafa-v2-master.js .jafafa-install-v2-master
      - name: Commit consolidated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f jafafa-v2-master.js .jafafa-install-v2-master || true
          git diff --cached --quiet && exit 0
          git commit -m 'Implement JaFaFaWeb 2.0 admin customer integration'
          git push
