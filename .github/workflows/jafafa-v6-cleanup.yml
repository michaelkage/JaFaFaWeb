name: JaFaFa v6 cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v6 consistency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def must_replace(text, pattern, repl, name, flags=0):
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'Expected exactly one match for {name}, got {n}')
              return new

          # ------------------------------------------------------------
          # ADMIN: canonical connection semantics, alert null-safety,
          # ownership conflict detection, command palette, demo auth.
          # ------------------------------------------------------------
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')

          s = s.replace('\\n    -webkit-user-select: none;\\n    -webkit-user-select: none;', '\\n    -webkit-user-select: none;')
          s = s.replace('-webkit-user-select:none;-webkit-user-select:none;', '-webkit-user-select:none;')
          s = s.replace('-webkit-backdrop-filter: blur(24px) saturate(130%);\\n-webkit-backdrop-filter:blur(24px) saturate(130%);', '-webkit-backdrop-filter: blur(24px) saturate(130%);')
          s = s.replace('-webkit-backdrop-filter:blur(24px) saturate(130%);\\n-webkit-backdrop-filter: blur(24px) saturate(130%);', '-webkit-backdrop-filter: blur(24px) saturate(130%);')
          s = re.sub(r'(-webkit-backdrop-filter:[^;]+;)\\s*\\1', r'\\1', s)

          # Fleet suite must consume the same telemetry core as the rest of admin.
          s = must_replace(
              s,
              r'function conn\(v\)\{.*?\}',
              'function conn(v){const a=window.analyzeVehicleTelemetry?.(v?.telemetry||[]);return a?.connection||"offline"}',
              'admin conn',
              re.S,
          )
          s = s.replace(
              'function connLabel(v){const s=conn(v);return s==="online"?"ONLINE":s==="recent"?"RECENT":"OFFLINE"}',
              'function connLabel(v){const s=conn(v);return s==="live"?"LIVE":s==="recent"?"RECENT":s==="stale"?"STALE":"OFFLINE"}'
          )
          s = s.replace(
              'function connClass(v){const s=conn(v);return s==="online"?"live":s==="recent"?"recent":"off"}',
              'function connClass(v){const s=conn(v);return s==="live"?"live":s==="recent"?"recent":s==="stale"?"stale":"off"}'
          )

          # Alert engine: never coerce missing telemetry to zero.
          s = re.sub(
              r'if\(Number\(l\.ctemp\|\|0\)>=TELEMETRY_CONFIG\.ctemp\.critical\)',
              'if(Number.isFinite(Number(l.ctemp))&&Number(l.ctemp)>=TELEMETRY_CONFIG.ctemp.critical)',
              s,
          )
          s = re.sub(
              r'if\(Number\(l\.ctemp\|\|0\)>=TELEMETRY_CONFIG\.ctemp\.warning\)',
              'if(Number.isFinite(Number(l.ctemp))&&Number(l.ctemp)>=TELEMETRY_CONFIG.ctemp.warning)',
              s,
          )
          s = re.sub(
              r'if\(Number\(l\.rpm\|\|0\)>=TELEMETRY_CONFIG\.rpm\.warning\)',
              'if(Number.isFinite(Number(l.rpm))&&Number(l.rpm)>=TELEMETRY_CONFIG.rpm.warning)',
              s,
          )
          s = re.sub(
              r'if\(Number\(l\.speed\|\|0\)>=TELEMETRY_CONFIG\.speed\.warning\)',
              'if(Number.isFinite(Number(l.speed))&&Number(l.speed)>=TELEMETRY_CONFIG.speed.warning)',
              s,
          )
          s = re.sub(
              r'if\(Number\(l\.voltage\|\|0\)<TELEMETRY_CONFIG\.voltage\.warningBelow\)',
              'if(Number.isFinite(Number(l.voltage))&&Number(l.voltage)>0&&Number(l.voltage)<TELEMETRY_CONFIG.voltage.warningBelow)',
              s,
          )

          # Remove the old Ctrl+K -> customer-search shortcut. The real command
          # palette handlers remain authoritative.
          s = re.sub(
              r'\n\s*if\(\(e\.ctrlKey\|\|e\.metaKey\)&&e\.key\.toLowerCase\(\)==="k"\)\{\s*e\.preventDefault\(\);\s*showScreen\("screen-customers"\);\s*customerSearchInput\?\.focus\(\);\s*\}',
              '',
              s,
              count=1,
          )

          # Disable the explicit local-demo credential path. Google/admin role
          # authentication remains; demo identity must not be accepted.
          s = re.sub(r'\n\s*function createLocalDemoCredential\(\)\{.*?\}\s*', '\\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*if\(r\?\.credential===[\"\']local-demo[\"\']\)\{.*?\}\s*', '\\n', s, count=1, flags=re.S)

          # Keep the existing admin core's 10/30/120 second freshness policy
          # authoritative; expose it through the fleet suite instead of the old
          # 2-minute/15-minute fallback.

          # Ownership normalization: detect duplicate nesting rather than silently
          # rewriting customerId. This is a repair/diagnostic flag, not an ownership
          # authority change.
          ownership_fn = r'''function detectOwnershipConflicts(db){
            const seen=new Map(), conflicts=[];
            (Array.isArray(db)?db:[]).forEach(c=>(Array.isArray(c.cars)?c.cars:[]).forEach(v=>{
              const id=String(v?.id??v?.recordId??""); if(!id)return;
              const prior=seen.get(id);
              if(prior && prior.customerId!==String(c.id)){
                const key=[id,prior.customerId,String(c.id)].sort().join("|");
                if(!conflicts.some(x=>x.key===key))conflicts.push({key,vehicleId:id,customerIds:[prior.customerId,String(c.id)]});
                v.ownershipConflict=true;
                v.ownershipConflictOwners=[prior.customerId,String(c.id)];
                prior.vehicle.ownershipConflict=true;
                prior.vehicle.ownershipConflictOwners=[prior.customerId,String(c.id)];
              }else if(!prior){seen.set(id,{customerId:String(c.id),vehicle:v});}
            }));
            window.JaFaFaOwnershipConflicts=conflicts;
            return conflicts;
          }
          '''
          marker = 'function load(){'
          if ownership_fn not in s:
              s = s.replace(marker, ownership_fn + '\n' + marker, 1)
          s = re.sub(r'(function load\(\)\{)([^}]*)', lambda m: m.group(1)+m.group(2)+('\n    detectOwnershipConflicts(MOCK_DATABASE);' if 'detectOwnershipConflicts(MOCK_DATABASE)' not in m.group(2) else ''), s, count=1, flags=re.S)

          # Make the fleet suite's data adapter preserve explicit customerId.
          s = s.replace('customerId:String(c.id)', 'customerId:String(v.customerId||c.id)')

          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # CUSTOMER: one health engine, configurable freshness, ownership
          # conflict detection, sortable log, chart gaps, no legacy password
          # semantics leaking into health.
          # ------------------------------------------------------------
          p = root / 'customer.html'
          s = p.read_text(encoding='utf-8')

          # Replace the early v2 local analysis/scoring with the shared engine.
          s = re.sub(
              r'function analyze\(v\)\{.*?\}\nfunction health\(v\)\{.*?\}\n',
              'function analyze(v){return window.analyzeVehicleTelemetry?window.analyzeVehicleTelemetry(v?.telemetry||[]):{latest:latest(v),connection:"offline",overall:"warning",score:null,categories:[]}}\\nfunction health(v){return window.vehicleHealthScore?.(v?.telemetry||[])??null}\\n',
              s,
              count=1,
              flags=re.S,
          )

          # The v2 ensure() path must not rewrite an already-assigned vehicle on
          # every login. Only assign an owner when the vehicle has no owner.
          s = s.replace('v.customerId=String(c.id);v.recordId=', 'if(!v.customerId)v.customerId=String(c.id);v.recordId=')

          # latest() should use the canonical latestTelemetry reducer when present.
          s = re.sub(
              r'function latest\(v\)\{[^}]*\}',
              'function latest(v){return window.latestTelemetry?.(v?.telemetry||[])||((v?.telemetry||[]).slice().sort((a,b)=>new Date(b.time||b.timestamp)-new Date(a.time||a.timestamp))[0]||null)}',
              s,
              count=1,
          )

          # Replace the second/overlay health4 adapter so it uses the same score
          # and status engine, while retaining its UI-friendly reasons shape.
          s = re.sub(
              r'function health4\(v\)\{.*?\}\n\s*window\.JaFaFaCore=',
              '''function health4(v){
                const a=window.analyzeVehicleTelemetry?.(v?.telemetry||[]);
                if(!a)return {score:null,reasons:["Telemetry analysis unavailable"],severity:"offline"};
                const reasons=[];
                if(a.cooling==="overheating")reasons.push("Coolant temperature critical");else if(a.cooling==="warm")reasons.push("Coolant temperature elevated");
                if(a.electrical==="low-voltage")reasons.push("Battery voltage below normal");
                if(a.engine==="running"&&a.latest?.rpm!=null&&Number(a.latest.rpm)>=TELEMETRY_CONFIG.rpm.warning)reasons.push("High engine RPM");
                if(a.latest?.speed!=null&&Number(a.latest.speed)>=TELEMETRY_CONFIG.speed.warning)reasons.push("High vehicle speed");
                if(a.connection==="offline")reasons.push("Telemetry connection offline");else if(a.connection==="stale")reasons.push("Telemetry connection is stale");
                return {score:a.score,reasons,severity:a.overall};
              }
              window.JaFaFaCore=''',
              s,
              count=1,
              flags=re.S,
          )

          # Canonical freshness in the early v2 analyze is now inherited from the
          # admin/core engine. Keep the UI state helper aligned too.
          s = re.sub(
              r'function telemetryState\(ts\)\{.*?\}',
              'function telemetryState(ts){const age=Date.now()-new Date(ts||0).getTime();if(!Number.isFinite(age)||age<0)return"offline";if(age<10000)return"live";if(age<30000)return"recent";if(age<120000)return"stale";return"offline"}',
              s,
              count=1,
          )

          # Customer dashboard stats: live/recent/offline are explicit; warning is
          # not conflated with connection freshness.
          s = s.replace("set('statOnline',as.filter(a=>a.connection==='online').length);set('statWarnings',as.filter(a=>a.overall==='warning').length+as.filter(a=>a.connection==='offline').length);", "set('statOnline',as.filter(a=>a.connection==='live').length);set('statWarnings',as.filter(a=>a.connection==='recent').length);set('statOffline',as.filter(a=>a.connection==='offline').length);")

          # Chart: preserve nulls so missing telemetry creates a visible gap.
          s = s.replace('const points=rows.map(x=>num(x[selectedParam])); let svg="";', 'const points=rows.map(x=>num(x[selectedParam])); let svg="";')
          s = re.sub(
              r'const pts=points\.map\(\(v,i\)=>v===null\?null:`\$\{35\+\(i/\(points\.length-1\|\|1\)\)\*830\},\$\{h-25-\(\(v-min\)/range\)\*170\}`\)\.filter\(Boolean\)\.join\(" "\);svg=',
              'const segments=[];let current=[];points.forEach((v,i)=>{if(v===null){if(current.length)segments.push(current.join(" "));current=[];return}current.push(`${35+(i/(points.length-1||1))*830},${h-25-((v-min)/range)*170}`)});if(current.length)segments.push(current.join(" "));svg=',
              s,
          )
          s = s.replace('<polyline class="line" points="${pts}"/>', '${segments.map(points=>`<polyline class="line" points="${points}"/>`).join("")}')

          # Sortable customer telemetry log.
          old_log = r'function renderLog\(data\)\{const rows=data\.slice\(\)\.sort\(\(a,b\)=>new Date\(b\.time\)-new Date\(a\.time\)\);\$\("logCount"\)\.textContent=`Showing \$\{rows\.length\.toLocaleString\(\)\} of \$\{rows\.length\.toLocaleString\(\)\} logs`;\$\("logBody"\)\.innerHTML=rows\.map\(x=>`<tr><td>\$\{new Date\(x\.time\|\|x\.timestamp\)\.toLocaleString\(\)</td><td>\$\{x\.speed\?\?"—"\}</td><td>\$\{x\.rpm\?\?"—"\}</td><td>\$\{x\.ctemp\?\?x\.coolant\?\?"—"\} °C</td><td>\$\{x\.voltage\?\?"—"\} V</td><td>\$\{x\.load\?\?"—"\}%</td></tr>`\)\.join\(""\);\}'
          new_log = '''let customerLogSort={key:"time",dir:"desc"};
function renderLog(data){const rows=data.slice().sort((a,b)=>{const av=a[customerLogSort.key]??a.time??a.timestamp,bv=b[customerLogSort.key]??b.time??b.timestamp;const an=Number(av),bn=Number(bv);const cmp=customerLogSort.key==="time"?(new Date(av).getTime()-new Date(bv).getTime()):(Number.isFinite(an)&&Number.isFinite(bn)?an-bn:String(av??"").localeCompare(String(bv??"")));return customerLogSort.dir==="asc"?cmp:-cmp});$("logCount").textContent=`Showing ${rows.length.toLocaleString()} of ${rows.length.toLocaleString()} logs`;
const headers=[['time','Time'],['speed','Speed'],['rpm','RPM'],['ctemp','Coolant'],['voltage','Voltage'],['load','Load']];
const head=document.querySelector("#logHead");if(head)head.innerHTML=headers.map(([k,label])=>`<th scope="col"><button type="button" class="log-sort ${customerLogSort.key===k?'active':''}" data-sort="${k}">${label} ${customerLogSort.key===k?(customerLogSort.dir==='asc'?'↑':'↓'):'↕'}</button></th>`).join("");
$("logBody").innerHTML=rows.map(x=>`<tr><td>${new Date(x.time||x.timestamp).toLocaleString()}</td><td>${x.speed??"—"}</td><td>${x.rpm??"—"}</td><td>${x.ctemp??x.coolant??"—"} °C</td><td>${x.voltage??"—"} V</td><td>${x.load??"—"}%</td></tr>`).join("");
head?.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(customerLogSort.key===k)customerLogSort.dir=customerLogSort.dir==='asc'?'desc':'asc';else{customerLogSort.key=k;customerLogSort.dir='asc'}renderLog(data)})}
'''
          s = re.sub(old_log, new_log, s, count=1)

          # Ownership normalization for customer DB: preserve customerId and flag
          # duplicate nested ownership instead of overwriting it.
          s = re.sub(
              r'function normalizeDb\(db\)\{.*?\}\n\s*function writeDb',
              '''function normalizeDb(db){
                const list=Array.isArray(db)?db:[],seen=new Map(),conflicts=[];
                list.forEach(c=>{
                  c.cars=Array.isArray(c.cars)?c.cars:[];
                  c.cars.forEach(v=>{
                    const id=String(v.id??v.recordId??"");if(!id)return;
                    const owner=String(c.id),prior=seen.get(id);
                    if(prior&&prior.owner!==owner){
                      const key=[id,prior.owner,owner].sort().join("|");
                      if(!conflicts.some(x=>x.key===key))conflicts.push({key,vehicleId:id,customerIds:[prior.owner,owner]});
                      v.ownershipConflict=true;v.ownershipConflictOwners=[prior.owner,owner];
                      prior.vehicle.ownershipConflict=true;prior.vehicle.ownershipConflictOwners=[prior.owner,owner];
                    }else if(!prior)seen.set(id,{owner,vehicle:v});
                    if(!v.customerId&&!v.ownershipConflict)v.customerId=owner;
                    v.recordId=v.recordId||uid("veh");v.telemetry=Array.isArray(v.telemetry)?v.telemetry:[];
                  });
                });
                window.JaFaFaOwnershipConflicts=conflicts;return list;
              }
              function writeDb''',
              s,
              count=1,
              flags=re.S,
          )

          # Ensure reassignment explicitly synchronizes ownership.
          s = s.replace('owner.cars.push(x.v);', 'x.v.customerId=String(owner.id);owner.cars.push(x.v);')

          # Remove obvious duplicate backdrop-filter declarations in customer CSS too.
          s = re.sub(r'(-webkit-backdrop-filter:[^;]+;)\\s*\\1', r'\\1', s)

          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # Static sanity checks. Fail rather than silently committing a bad patch.
          # ------------------------------------------------------------
          for name in ('index.html','customer.html'):
              text=(root/name).read_text(encoding='utf-8')
              if '<html' not in text.lower() or '</html>' not in text.lower():
                  raise SystemExit(f'{name}: malformed HTML wrapper')
          idx=(root/'index.html').read_text(encoding='utf-8')
          cx=(root/'customer.html').read_text(encoding='utf-8')
          checks=[
              ('admin shared connection', 'window.analyzeVehicleTelemetry?.(v?.telemetry||[])', idx),
              ('admin finite ctemp', 'Number.isFinite(Number(l.ctemp))', idx),
              ('admin ownership conflict', 'window.JaFaFaOwnershipConflicts=conflicts', idx),
              ('customer shared health', 'window.vehicleHealthScore?.(v?.telemetry||[])', cx),
              ('customer sortable log', 'customerLogSort', cx),
              ('customer ownership conflict', 'ownershipConflictOwners', cx),
          ]
          for label,needle,text in checks:
              if needle not in text: raise SystemExit(f'missing validation marker: {label}')
          print('v6 consistency patch validated')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Unify telemetry freshness and ownership handling [jafafa-v6]'
            git push
          fi

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/jafafa-v6-cleanup.yml
          git commit -m 'Remove temporary v6 cleanup workflow'
          git push
