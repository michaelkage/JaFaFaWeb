name: Consolidate activation system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate activation code system
        shell: python
        run: |
          from pathlib import Path
          import re

          ACTIVATION_JS = r'''/* JaFaFa one-time activation code layer. Prototype/localStorage only. */
          (() => {
            'use strict';
            const KEY = 'jafafaActivationCodes';
            const normalize = v => String(v || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
            const load = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch { return []; } };
            const save = v => localStorage.setItem(KEY, JSON.stringify(v));
            const random = n => { const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s += chars[Math.floor(Math.random()*chars.length)]; return s; };
            window.JaFaFaActivation = {
              list: load,
              save,
              generate() {
                const codes = load(); let code;
                do { code = `JFF-${random(4)}-${random(4)}-${random(4)}`; } while(codes.some(x => x.code === code));
                const record = { code, status:'AVAILABLE', createdAt:new Date().toISOString(), activatedAt:null, customerId:null, vehicleId:null };
                codes.push(record); save(codes); return record;
              },
              verify(raw) {
                const code = normalize(raw); if(!/^JFF-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) return {ok:false, reason:'Invalid activation code format.'};
                const codes = load(); const item = codes.find(x => x.code === code);
                if(!item) return {ok:false, reason:'Activation code not found.'};
                if(item.status === 'ACTIVATED') return {ok:false, reason:'This activation code has already been used.'};
                if(item.status === 'DISABLED') return {ok:false, reason:'This activation code has been disabled.'};
                return {ok:true, code, item};
              },
              consume(raw, customerId, vehicleId) {
                const result = this.verify(raw); if(!result.ok) return result;
                const codes = load(); const item = codes.find(x => x.code === result.code);
                item.status='ACTIVATED'; item.activatedAt=new Date().toISOString(); item.customerId=String(customerId||''); item.vehicleId=String(vehicleId||''); save(codes); return {ok:true,item};
              },
              disable(raw) {
                const code=normalize(raw); const codes=load(); const item=codes.find(x=>x.code===code); if(!item) return false; if(item.status==='ACTIVATED') return false; item.status='DISABLED'; save(codes); return true;
              }
            };
          })();
          '''

          def read(name): return Path(name).read_text(encoding='utf-8')
          def write(name, text): Path(name).write_text(text, encoding='utf-8')

          # 1) Main customer: move the standalone privacy/activation JS into the HTML.
          p=Path('customer.html'); s=read(p)
          external='<script src="customer-activation-ui.js"></script>'
          if external in s:
              ui=read('customer-activation-ui.js')
              s=s.replace(external, '<script>\n'+ui+'\n</script>', 1)

          # Add the canonical activation helper if the current main portal does not have it yet.
          if 'window.JaFaFaActivation' not in s:
              s=s.replace('</body>', '<script>\n'+ACTIVATION_JS+'\n</script>\n</body>', 1)

          # Replace customer-facing MAC registration with activation code where those legacy fields exist.
          s=s.replace('Verify the MAC address supplied with your telemetry dongle.', 'Enter the one-time activation code supplied with your physical JaFaFa dongle.')
          s=s.replace('Dongle verification</strong><br>The MAC address is checked against the\n                    registered dongle inventory. It must be a real Telemetry Hub dongle and it must not already be\n                    assigned to another vehicle.', 'Activation verification</strong><br>Your one-time activation code proves that the physical JaFaFa dongle was issued for customer activation. A used or disabled code cannot be registered again.')
          s=re.sub(r'<div class="form-group full"><label for="regMac">Dongle MAC Address</label>.*?</div>\s*</div>', '<div class="form-group full"><label for="regActivationCode">Activation Code</label><div class="verify-row"><input id="regActivationCode" required placeholder="JFF-ABCD-EFGH-JKLM" autocomplete="off"><button type="button" class="secondary" onclick="verifyRegistrationActivation()">Verify Code</button></div><div id="activationVerification" class="verification"></div><span class="field-help">Use the one-time code supplied with your physical JaFaFa dongle. The code is consumed after successful registration.</span></div></div>', s, count=1, flags=re.S)
          # Hide protected identity fields if present in detail/editor markup.
          s=re.sub(r'<div class="detail"><b>Dongle MAC</b>.*?</div>', '<div class="detail"><b>Activation</b><span style="color:#4ade80">Verified · Locked</span></div>', s, count=1, flags=re.S)
          s=re.sub(r'<div class="form-group"><label for="editMac">Dongle MAC Address</label>.*?</div>', '<div class="form-group"><label>Activation</label><input value="Verified · Locked" readonly><span class="locked">Locked after activation. Device identity is protected.</span></div>', s, count=1, flags=re.S)
          write(p,s)

          # 2) Boring customer: preserve the plain UI but replace MAC verification with activation codes.
          p=Path('customerboring.html'); s=read(p)
          s=s.replace('Enter your vehicle information and verify the MAC address supplied with your telemetry dongle.', 'Enter your vehicle information and verify the one-time activation code supplied with your physical JaFaFa dongle.')
          s=s.replace('<div class="section-note"><strong>Dongle verification</strong><br>The MAC address is checked against the\n                    registered dongle inventory. It must be a real Telemetry Hub dongle and it must not already be\n                    assigned to another vehicle.</div>', '<div class="section-note"><strong>Activation verification</strong><br>Your one-time activation code proves that the physical JaFaFa dongle was issued for customer activation. A used or disabled code cannot be registered again.</div>')
          s=re.sub(r'<div class="form-group full"><label for="regMac">Dongle MAC Address</label>.*?</div>\s*</div>', '<div class="form-group full"><label for="regActivationCode">Activation Code</label><div class="verify-row"><input id="regActivationCode" required placeholder="JFF-ABCD-EFGH-JKLM" autocomplete="off"><button type="button" class="secondary" onclick="verifyRegistrationActivation()">Verify Code</button></div><div id="activationVerification" class="verification"></div><span class="field-help">Use the one-time code supplied with your physical JaFaFa dongle. The code is consumed after successful registration.</span></div></div>', s, count=1, flags=re.S)
          s=re.sub(r'<div class="detail"><b>Vehicle ID</b>.*?</div>', '', s, count=1, flags=re.S)
          s=re.sub(r'<div class="detail"><b>Dongle MAC</b>.*?</div>', '<div class="detail"><b>Activation</b><span style="color:#4ade80">Verified · Locked</span></div>', s, count=1, flags=re.S)
          s=re.sub(r'<div class="form-group"><label for="editMac">Dongle MAC Address</label>.*?</div>', '<div class="form-group"><label>Activation</label><input value="Verified · Locked" readonly><span class="locked">Locked after activation. Device identity is protected.</span></div>', s, count=1, flags=re.S)

          # Remove the old local dongle inventory declarations and MAC helpers from boring customer JS.
          s=re.sub(r'\s*const DEVICE_KEY = .*?;\n\s*const DEFAULT_DEVICES = \[.*?\];\n', '\n', s, count=1, flags=re.S)
          s=s.replace('let DONGLE_INVENTORY = loadJson(DEVICE_KEY, null) || structuredClone(DEFAULT_DEVICES);\n','')
          s=s.replace('let customerUser = null, customerVehicle = null, pendingGoogleUser = null, verifiedRegistrationMac = null;','let customerUser = null, customerVehicle = null, pendingGoogleUser = null, verifiedRegistrationCode = null;')
          s=re.sub(r'\s*function saveDevices\(\) \{.*?\}\n', '\n', s, count=1, flags=re.S)
          s=re.sub(r'\s*function normalizeMac\(value\) \{.*?\}\n\s*function isValidMac\(mac\) \{.*?\}\n', '\n', s, count=1, flags=re.S)

          old_verify=re.search(r'\s*function verifyRegistrationMac\(\) \{.*?\n        \}\n        function registerVehicle', s, re.S)
          if old_verify:
              replacement='''\n        function verifyRegistrationActivation() {\n            const input = document.getElementById("regActivationCode"); const code = String(input.value || "").trim().toUpperCase(); input.value = code;\n            const box = document.getElementById("activationVerification"); verifiedRegistrationCode = null;\n            const result = window.JaFaFaActivation.verify(code);\n            if (!result.ok) { box.className = "verification bad"; box.textContent = result.reason; return false; }\n            verifiedRegistrationCode = result.code; box.className = "verification ok"; box.textContent = "Activation code verified ✓ It is available for one-time registration."; return true;\n        }\n        function registerVehicle'''
              s=s[:old_verify.start()]+replacement+s[old_verify.end()-len('function registerVehicle'):]

          old_reg=re.search(r'function registerVehicle\(e\) \{.*?\n        \}\n        function customerOpenVehicle', s, re.S)
          if old_reg:
              new_reg='''function registerVehicle(e) {\n            e.preventDefault();\n            if (!customerUser) return;\n            if (!verifyRegistrationActivation() || !verifiedRegistrationCode) { alert("Please verify a valid, unused JaFaFa activation code before registering the vehicle."); return; }\n            const vin = regVin.value.trim().toUpperCase();\n            if (customerUser.cars?.some(c => String(c.vin || "").toUpperCase() === vin)) { alert("A vehicle with this VIN is already registered to your account."); return; }\n            const vehicle = { id: makeId("vehicle-"), make: regMake.value.trim(), model: regModel.value.trim(), year: Number(regYear.value), plate: regPlate.value.trim().toUpperCase(), vin, nickname: regNickname.value.trim(), status: "Active", activationStatus: "Verified" };\n            customerUser.cars = customerUser.cars || []; customerUser.cars.push(vehicle);\n            const consumed = window.JaFaFaActivation.consume(verifiedRegistrationCode, customerUser.id, vehicle.id);\n            if (!consumed.ok) { customerUser.cars = customerUser.cars.filter(c => c !== vehicle); alert(consumed.reason || "Activation failed."); return; }\n            saveDatabase(); customerVehicle = vehicle; verifiedRegistrationCode = null; renderCustomer(); customerOpenVehicle(vehicle.id);\n        }\n        function customerOpenVehicle'''
              s=s[:old_reg.start()]+new_reg+s[old_reg.end()-len('function customerOpenVehicle'):]

          # Remove remaining direct MAC display in boring render cards.
          s=s.replace('${car.mac ? `<div class="device-badge"><span class="device-dot"></span> Dongle verified</div>` : `<div class="device-badge" style="color:#fbbf24"><span class="device-dot" style="background:#fbbf24"></span> Dongle not assigned</div>`}', '${car.activationStatus === "Verified" ? `<div class="device-badge"><span class="device-dot"></span> Activation verified · locked</div>` : `<div class="device-badge" style="color:#fbbf24"><span class="device-dot" style="background:#fbbf24"></span> Activation required</div>`}')
          s=s.replace('document.getElementById("registerVehicleForm").reset(); verifiedRegistrationMac = null; macVerification.className = "verification"; macVerification.textContent = "";', 'document.getElementById("registerVehicleForm").reset(); verifiedRegistrationCode = null; activationVerification.className = "verification"; activationVerification.textContent = "";')
          s=s.replace('saveDatabase(); saveDevices(); customerVehicle = vehicle; verifiedRegistrationMac = null;', 'saveDatabase(); customerVehicle = vehicle; verifiedRegistrationCode = null;')
          s=s.replace('editMac.value = customerVehicle.mac || "Not assigned";', 'editMac.value = "Verified · Locked";')
          # Replace any remaining customer-facing MAC language in boring file.
          s=s.replace('Dongle MAC', 'Activation')
          # Add the shared activation layer before the Google script.
          if 'window.JaFaFaActivation' not in s:
              s=s.replace('    <script src="https://accounts.google.com/gsi/client"', '    <script>\n'+ACTIVATION_JS+'\n    </script>\n    <script src="https://accounts.google.com/gsi/client"', 1)
          write(p,s)

          # 3) Boring admin: add a plain activation-code inventory panel and generator.
          p=Path('indexboring.html'); s=read(p)
          if 'id="activation-code-panel"' not in s:
              panel='''\n<section id="activation-code-panel" class="selected-summary-card" style="margin-top:1.5rem">\n  <h2 style="margin-bottom:.5rem;color:#38bdf8">Activation Codes</h2>\n  <p style="color:#94a3b8;margin-bottom:1rem">Generate one-time codes for physical JaFaFa dongles. Give the code to the customer with the sealed product. A code can be activated only once.</p>\n  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem">\n    <button class="btn-action" type="button" onclick="jafafaGenerateActivationCode()">Generate Activation Code</button>\n    <button class="btn-back" type="button" onclick="jafafaRefreshActivationCodes()">Refresh</button>\n  </div>\n  <div id="activation-code-output" style="margin-bottom:1rem"></div>\n  <div class="table-container" style="max-height:360px">\n    <table class="telemetry-table" style="min-width:700px"><thead><tr><th>Code</th><th>Status</th><th>Created</th><th>Activated</th><th>Customer</th><th>Vehicle</th><th>Action</th></tr></thead><tbody id="activation-code-rows"></tbody></table>\n  </div>\n</section>\n'''
              # Put it into the main app area, before the first closing main.\n              s=s.replace('</main>', panel+'</main>', 1)
              admin_script='''\n<script>\n(() => {\n  const KEY='jafafaActivationCodes';\n  const load=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}};\n  const save=v=>localStorage.setItem(KEY,JSON.stringify(v));\n  const rand=n=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s};\n  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));\n  window.jafafaGenerateActivationCode=()=>{const a=load();let code;do{code=`JFF-${rand(4)}-${rand(4)}-${rand(4)}`}while(a.some(x=>x.code===code));a.push({code,status:'AVAILABLE',createdAt:new Date().toISOString(),activatedAt:null,customerId:null,vehicleId:null});save(a);jafafaRefreshActivationCodes();document.getElementById('activation-code-output').innerHTML=`<div style="padding:.8rem;border:1px solid #38bdf8;border-radius:8px;background:#0f172a"><strong style="color:#4ade80">New code:</strong> <code style="font-size:1.1rem;color:#f8fafc">${code}</code><br><span style="color:#94a3b8;font-size:.78rem">Write this code onto the physical product package. It is one-time use.</span></div>`};\n  window.jafafaRefreshActivationCodes=()=>{const rows=document.getElementById('activation-code-rows');if(!rows)return;const a=load();rows.innerHTML=a.length?a.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${esc(x.status)}</td><td>${esc(x.createdAt?new Date(x.createdAt).toLocaleString():'—')}</td><td>${esc(x.activatedAt?new Date(x.activatedAt).toLocaleString():'—')}</td><td>${esc(x.customerId||'—')}</td><td>${esc(x.vehicleId||'—')}</td><td>${x.status==='AVAILABLE'?`<button class="btn-back" type="button" onclick="jafafaDisableActivationCode('${x.code}')">Disable</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="7" style="color:#94a3b8">No activation codes yet.</td></tr>'};\n  window.jafafaDisableActivationCode=code=>{const a=load();const x=a.find(v=>v.code===code);if(!x||x.status!=='AVAILABLE')return;x.status='DISABLED';save(a);jafafaRefreshActivationCodes()};\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',jafafaRefreshActivationCodes,{once:true});else jafafaRefreshActivationCodes();\n})();\n</script>\n'''
              s=s.replace('</body>',admin_script+'</body>',1)
          write(p,s)

          # 4) Keep the standalone JS only as a migration artifact for this run; main customer now owns it.
          try: Path('customer-activation-ui.js').unlink()
          except FileNotFoundError: pass

          # Basic syntax sanity checks for the HTML-embedded JS blocks.
          for name in ('customer.html','customerboring.html','indexboring.html'):
              text=read(name)
              assert '<script' in text and '</script>' in text, name
          print('Activation consolidation complete.')
      - name: Commit consolidated files and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html customerboring.html indexboring.html customer-activation-ui.js .github/workflows/consolidate-activation-system.yml
          git commit -m 'Consolidate activation codes into portal HTML files'
          git push
