name: JaFaFa Pass ABC consolidation
on:
  push:
    paths:
      - '.jafafa-pass-abc'
permissions:
  contents: write
jobs:
  consolidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="./fleet-management.js"></script>\n','')
          s=re.sub(r'<script>\n?\(\(\)=>\{\'use strict\';const S=\{sortKey:\'time\'.*?</script>\n','',s,count=1,flags=re.S)
          old='00:10:CC:4F:36:03'
          for new in ['00:10:CC:4F:36:04','00:10:CC:4F:36:05','00:10:CC:4F:36:06','00:10:CC:4F:36:07']:
              s=s.replace(old,new,1)
          css='''.jf-telemetry-statusbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(8,15,29,.68);backdrop-filter:blur(14px)}.jf-telemetry-status-main{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.jf-live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);display:inline-block}.jf-live-dot.warn{background:var(--amber);box-shadow:0 0 14px var(--amber)}.jf-live-dot.offline{background:var(--red);box-shadow:0 0 14px var(--red)}.jf-telemetry-status-title{font-weight:850}.jf-telemetry-status-muted{color:var(--muted);font-size:.76rem}.jf-quick-range{display:flex;gap:6px;flex-wrap:wrap}.jf-quick-range button{border:1px solid var(--line);background:rgba(15,23,42,.55);color:#9fb0c7;padding:7px 10px;border-radius:9px;font-size:.72rem;font-weight:800}.jf-quick-range button.active,.jf-quick-range button:hover{color:#e0f2fe;border-color:var(--line-bright);background:rgba(56,189,248,.08)}.jf-filter-search{grid-column:1/-1}.jf-filter-section-label{grid-column:1/-1;color:#64748b;font-size:.66rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}.jf-sortable{cursor:pointer!important;user-select:none}.jf-sortable.jf-sort-active{color:#e0f2fe!important;background:rgba(56,189,248,.11)!important;box-shadow:inset 0 -2px 0 var(--cyan)}.jf-sort-arrow{margin-left:.35rem;color:var(--cyan);font-size:.68rem}.telemetry-table th:first-child,.telemetry-table td:first-child{position:sticky;left:0;z-index:4;background:#07101e;box-shadow:8px 0 16px -12px rgba(56,189,248,.35);border-right:1px solid rgba(56,189,248,.12)}.telemetry-table th:first-child{z-index:6}.telemetry-table tbody tr{cursor:pointer}.jf-stage-state{position:absolute;z-index:5;left:50%;top:18px;transform:translateX(-50%);text-align:center;pointer-events:none}.jf-stage-state-label{font-size:.61rem;letter-spacing:.15em;text-transform:uppercase;color:#7f93ad}.jf-stage-state-title{margin-top:3px;font-size:.92rem;font-weight:900;letter-spacing:.08em}.jf-stage-state-sub{margin-top:3px;color:#94a3b8;font-size:.7rem}.jf-telemetry-stage.state-warning{box-shadow:inset 0 0 90px rgba(251,191,36,.06)}.jf-telemetry-stage.state-offline{filter:saturate(.35);opacity:.82}.jf-detail-backdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(2,6,16,.72);backdrop-filter:blur(10px)}.jf-detail-card{width:min(760px,100%);max-height:84vh;overflow:auto;border:1px solid rgba(56,189,248,.28);border-radius:22px;background:rgba(8,16,31,.97);box-shadow:0 30px 100px rgba(0,0,0,.55)}.jf-detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px;border-bottom:1px solid var(--line)}.jf-detail-head h3{margin:0}.jf-detail-sub{color:var(--muted);font-size:.75rem;margin-top:4px}.jf-detail-close{border:1px solid #334155;background:#0f172a;color:#cbd5e1;border-radius:9px;padding:7px 10px}.jf-detail-section{padding:16px 20px 0}.jf-detail-section h4{margin:0 0 9px;color:#9fb0c7;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.jf-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.jf-detail-item{padding:12px;border:1px solid rgba(148,163,184,.1);border-radius:11px;background:#0b1425}.jf-detail-label{display:block;color:#64748b;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.jf-detail-value{color:#e2e8f0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}.jf-fleet-status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.jf-fleet-status-card{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.jf-health-track{height:10px;border-radius:999px;background:rgba(148,163,184,.12);overflow:hidden}.jf-health-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--cyan2));transition:width .7s cubic-bezier(.22,1,.36,1)}.jf-health-score{font-size:2rem;font-weight:900;letter-spacing:-.06em}.jf-command-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.jf-command-chip{padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:.72rem;font-weight:800}.jf-command-chip.critical{color:#fecdd3;border-color:rgba(251,113,133,.25);background:rgba(251,113,133,.07)}.jf-command-chip.warning{color:#fde68a;border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.07)}.jf-command-chip.info{color:#bae6fd;border-color:rgba(56,189,248,.22);background:rgba(56,189,248,.06)}@media(max-width:760px){.jf-detail-grid{grid-template-columns:1fr 1fr}.jf-fleet-status-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.jf-detail-grid{grid-template-columns:1fr}.jf-fleet-status-grid{grid-template-columns:1fr}.filter-form{grid-template-columns:1fr!important}}'''
          s=s.replace('</style>',css+'</style>',1)
          old_stage=re.search(r'<div class="jf-telemetry-stage scroll-reveal">.*?</div>\n<div class="filter-panel',s,re.S)
          if not old_stage: raise SystemExit('stage not found')
          stage='<div id="jfTelemetryStage" class="jf-telemetry-stage scroll-reveal"><div class="jf-stage-state"><div class="jf-stage-state-label">Live telemetry</div><div id="jfStageStateTitle" class="jf-stage-state-title">WAITING</div><div id="jfStageStateSub" class="jf-stage-state-sub">Select a vehicle to begin</div></div><div class="jf-hud left"><div class="jf-hud-card"><div class="jf-hud-label">Speed</div><div id="jfHudSpeed" class="jf-hud-value">— <span>km/h</span></div></div><div class="jf-hud-card"><div class="jf-hud-label">RPM</div><div id="jfHudRpm" class="jf-hud-value">— <span>rpm</span></div></div></div><div class="jf-hud right"><div class="jf-hud-card"><div class="jf-hud-label">Coolant</div><div id="jfHudCoolant" class="jf-hud-value">— <span>°C</span></div></div><div class="jf-hud-card"><div class="jf-hud-label">Engine load</div><div id="jfHudLoad" class="jf-hud-value">— <span>%</span></div></div></div><canvas id="jf-stage-canvas"></canvas><div class="jf-stage-caption">LIVE TELEMETRY FIELD · VISUALIZATION USES ACTIVE VEHICLE DATA</div></div>\n<div class="filter-panel'
          s=s[:old_stage.start()]+stage+s[old_stage.end():]
          filter_re=re.compile(r'<div class="filter-panel scroll-reveal">.*?</div>\n<div id="telemetryTableWrap"',re.S)
          if not filter_re.search(s): raise SystemExit('filter not found')
          nf='''<div class="filter-panel scroll-reveal"><div class="filter-form"><div class="form-group jf-filter-search"><label for="telemetrySearch">Search telemetry</label><input id="telemetrySearch" class="form-control" type="search" placeholder="Search value, timestamp, parameter…" autocomplete="off"/></div><div class="jf-filter-section-label">Quick range</div><div class="jf-quick-range" style="grid-column:1/-1"><button type="button" data-range="all" class="active">All</button><button type="button" data-range="1h">1H</button><button type="button" data-range="24h">24H</button><button type="button" data-range="7d">7D</button><button type="button" data-range="30d">30D</button></div><div class="jf-filter-section-label">Condition</div><div class="form-group"><label for="engineStatus">Engine</label><select id="engineStatus" class="form-control"><option value="all">All states</option><option value="running">Running</option><option value="moving">Moving</option><option value="idling">Idling</option><option value="off">Off</option></select></div><div class="form-group"><label for="metricType">Metric</label><select id="metricType" class="form-control"><option value="all">All metrics</option><option value="speed">High speed</option><option value="temp">High temperature</option><option value="overheat">Overheat</option><option value="battery">Low voltage</option><option value="rpm">High RPM</option></select></div><div class="form-group"><label for="minSpeed">Minimum speed</label><input id="minSpeed" class="form-control" type="number" min="0" value="0"/></div><div class="jf-filter-section-label">Date & time</div><div class="form-group"><label for="startDate">Date</label><input id="startDate" class="form-control" type="date"/></div><div class="form-group"><label for="startTime">Time</label><input id="startTime" class="form-control" type="time"/></div><div class="form-group"><label for="timeRange">Range</label><select id="timeRange" class="form-control"><option value="all">All time</option><option value="1h">Last hour</option><option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option></select></div><div style="grid-column:1/-1;display:flex;justify-content:flex-end"><button id="jfClearFilters" class="btn-secondary" type="button">Clear filters</button></div></div></div><div class="jf-telemetry-meta"><div class="jf-telemetry-statusbar" style="width:100%"><div class="jf-telemetry-status-main"><span id="jfLiveDot" class="jf-live-dot"></span><span id="jfTelemetryStatusTitle" class="jf-telemetry-status-title">Telemetry log</span><span id="jfTelemetryCount" class="jf-telemetry-status-muted">0 visible · 0 total</span><span id="jfTelemetryUpdated" class="jf-telemetry-status-muted">Not updated</span></div><div class="jf-telemetry-actions"><button id="jfTelemetryExport" class="btn-secondary" type="button">Export</button></div></div></div><div id="telemetryTableWrap"'''
          s=filter_re.sub(nf,s,count=1)
          core='''function latestTelemetry(logs){const list=Array.isArray(logs)?logs:[];let best=null,bestTime=-Infinity;for(const row of list){const d=parseTime(row?.time??row?.timestamp);const t=d?d.getTime():-Infinity;if(t>bestTime){best=row;bestTime=t}}return best}\nconst TELEMETRY_RULES={speed:{warning:100},rpm:{warning:5000},ctemp:{warning:105},voltage:{warning:12}};\nfunction telemetryRule(key,value){const v=num(value);if(!Number.isFinite(v))return "normal";if(key==="speed"&&v>=100)return "warning";if(key==="rpm"&&v>=5000)return "warning";if(key==="ctemp"&&v>=105)return "warning";if(key==="voltage"&&v>0&&v<12)return "warning";return "normal"}\nfunction normalizeTelemetryRecord(r,vid){const clean=v=>{if(v===null||v===undefined||v==="")return null;const n=Number(v);return Number.isFinite(n)?n:null};const raw=r||{},time=raw.Timestamp??raw.timestamp??raw.created_at??raw.time??"";return {id:String(raw.Id??raw.id??`${vid||raw.VehicleId||raw.vehicleId||"vehicle"}-${time}`),vehicleId:String(raw.VehicleId??raw.vehicleId??vid??""),time,speed:clean(raw.Speed??raw.speed),rpm:clean(raw.Revolutions_Per_Minute??raw.Engine_RPM??raw.rpm),maf:clean(raw.Mass_Air_Flow??raw.maf),ctemp:clean(raw.Coolant_Temperature??raw.ctemp??raw.coolantTemp),fuel:clean(raw.Fuel_Level??raw.fuel),voltage:clean(raw.Voltage??raw.voltage),evap:clean(raw.Evaporative_Emission_Control??raw.evap??raw.evapEmission),timing:clean(raw.Engine_Timing??raw.Injector_Timing??raw.timing??raw.engineTiming),etemp:clean(raw.Engine_Temperature??raw.etemp??raw.engineTemp),mpg:clean(raw.Miles_Per_Gallon??raw.mpg),iat:clean(raw.Intake_Air_Temperature??raw.iat??raw.intakeTemp),throttle:clean(raw.Throttle_Position??raw.throttle??raw.throttlePos),load:clean(raw.Engine_Load??raw.load??raw.engineLoad),atemp:clean(raw.Atmospheric_Temperature??raw.atemp??raw.atmoTemp),bpressure:clean(raw.Barometric_Pressure??raw.bpressure??raw.baroPressure)}}\nfunction mapTelemetryData(raw,vid){return Array.isArray(raw)?raw.map(r=>normalizeTelemetryRecord(r,vid)):[]}\nfunction telemetryStatusFor(logs){const latest=latestTelemetry(logs);if(!latest)return {state:"offline",latest:null,lastSeen:null};const d=parseTime(latest.time),age=d?Date.now()-d.getTime():Infinity;return {state:age<=120000?"online":age<=900000?"recent":"offline",latest,lastSeen:d,age}}\nfunction filteredTelemetryRecords(){if(!activeCar)return [];const source=Array.isArray(activeCar.telemetry)?activeCar.telemetry:[],ms=num(document.getElementById("minSpeed")?.value),metric=document.getElementById("metricType")?.value||"all",engine=document.getElementById("engineStatus")?.value||"all",sd=document.getElementById("startDate")?.value||"",st=document.getElementById("startTime")?.value||"",preset=document.getElementById("timeRange")?.value||"all",q=(document.getElementById("telemetrySearch")?.value||"").trim().toLowerCase(),hours={"1h":1,"24h":24,"7d":168,"30d":720}[preset],cutoff=hours?Date.now()-hours*3600000:null;return source.filter(l=>{const s=num(l.speed),r=num(l.rpm),t=num(l.ctemp),v=num(l.voltage),d=parseTime(l.time);if(s<ms)return false;if(metric==="speed"&&s<100)return false;if(metric==="temp"&&t<105)return false;if(metric==="overheat"&&t<110)return false;if(metric==="battery"&&(v<=0||v>=12))return false;if(metric==="rpm"&&r<5000)return false;if(engine==="running"&&r<=0)return false;if(engine==="moving"&&s<=0)return false;if(engine==="idling"&&!(s===0&&r>0))return false;if(engine==="off"&&r!==0)return false;if(sd&&d&&d.toLocaleDateString("en-CA")!==sd)return false;if(st&&d&&d.toTimeString().slice(0,5)!==st)return false;if(cutoff&&(!d||d.getTime()<cutoff))return false;if(q&&!JSON.stringify(l).toLowerCase().includes(q))return false;return true})}\nlet telemetrySortKey="time",telemetrySortDir=-1;function sortTelemetry(rows){return rows.slice().sort((a,b)=>{const av=telemetrySortKey==="time"?(parseTime(a.time)?.getTime()||-Infinity):num(a[telemetrySortKey]),bv=telemetrySortKey==="time"?(parseTime(b.time)?.getTime()||-Infinity):num(b[telemetrySortKey]);return av<bv?-telemetrySortDir:av>bv?telemetrySortDir:0})}\nconst columns=["time","speed","rpm","maf","ctemp","fuel","voltage","evap","timing","etemp","mpg","iat","throttle","load","atemp","bpressure"],units={speed:"km/h",rpm:"rpm",maf:"g/s",ctemp:"°C",fuel:"%",voltage:"V",evap:"%",timing:"°",etemp:"°C",mpg:"mpg",iat:"°C",throttle:"%",load:"%",atemp:"kPa",bpressure:"kPa"},columnLabels={time:"Timestamp",speed:"Speed",rpm:"RPM",maf:"MAF",ctemp:"Coolant",fuel:"Fuel",voltage:"Voltage",evap:"EVAP",timing:"Timing",etemp:"Engine temp",mpg:"MPG",iat:"Intake",throttle:"Throttle",load:"Load",atemp:"Atmo",bpressure:"Baro"};\nfunction setupTelemetryTable(){const table=document.getElementById("telemetryTable");if(!table||table.dataset.coreReady)return;table.dataset.coreReady="1";table.querySelectorAll("thead th").forEach((th,i)=>{const key=columns[i];th.dataset.sortKey=key;th.classList.add("jf-sortable");th.addEventListener("click",()=>{telemetrySortDir=telemetrySortKey===key?-telemetrySortDir:-1;telemetrySortKey=key;renderTelemetryTable(filteredTelemetryRecords())})})}\nfunction updateTelemetryHeaders(){document.querySelectorAll("#telemetryTable th[data-sort-key]").forEach(th=>{const active=th.dataset.sortKey===telemetrySortKey;th.classList.toggle("jf-sort-active",active);const base=columnLabels[th.dataset.sortKey];th.innerHTML=`<span>${esc(base)}</span>${active?`<span class="jf-sort-arrow">${telemetrySortDir===1?"▲":"▼"}</span>`:""}`})}\nfunction telemetryValue(k,v){if(v===null||v===undefined)return "—";const dec=["voltage","maf","mpg"].includes(k)?2:1;return `${Number(v).toFixed(dec)} ${units[k]||""}`.trim()}\nfunction renderTelemetryTable(logs){setupTelemetryTable();const body=document.getElementById("telemetryTableBody"),source=Array.isArray(activeCar?.telemetry)?activeCar.telemetry:[],display=sortTelemetry(Array.isArray(logs)?logs:[]);if(!body)return;const count=document.getElementById("jfTelemetryCount");if(count)count.textContent=`${display.length.toLocaleString()} visible · ${source.length.toLocaleString()} total`;const updated=document.getElementById("jfTelemetryUpdated");if(updated)updated.textContent=`Last updated ${new Date().toLocaleTimeString()}`;const status=telemetryStatusFor(source),dot=document.getElementById("jfLiveDot"),title=document.getElementById("jfTelemetryStatusTitle");if(dot)dot.className=`jf-live-dot ${status.state==='offline'?'offline':status.state==='recent'?'warn':''}`;if(title)title.textContent=status.state==='online'?'Live telemetry':status.state==='recent'?'Recent telemetry':'Telemetry log';if(!display.length){body.innerHTML=`<tr><td colspan="16"><div class="empty-state">${source.length?'No logs match your filters.':'No telemetry data for this vehicle.'}</div></td></tr>`;return}body.innerHTML=display.map(l=>`<tr data-telemetry-id="${esc(l.id)}">${columns.map(k=>k==='time'?`<td title="${esc(l.time)}">${esc(prettyTime(l.time))}</td>`:`<td><span class="${telemetryRule(k,l[k])==='warning'?'badge-warning':''}">${esc(telemetryValue(k,l[k]))}</span></td>`).join("")}</tr>`).join("");updateTelemetryHeaders()}\nfunction telemetryDetail(log){if(!log)return;document.querySelector(".jf-detail-backdrop")?.remove();const groups=[['Engine',['rpm','ctemp','etemp','timing','load']],['Driving',['speed','throttle']],['Electrical',['voltage']],['Air',['maf','iat','bpressure']],['Fuel & emissions',['fuel','mpg','evap']],['Environment',['atemp']]];const wrap=document.createElement("div");wrap.className="jf-detail-backdrop";wrap.innerHTML=`<div class="jf-detail-card" role="dialog" aria-modal="true"><div class="jf-detail-head"><div><h3>Telemetry sample</h3><div class="jf-detail-sub">${esc(activeCar?`${activeCar.year} ${activeCar.make} ${activeCar.model}`:"Vehicle")} · ${esc(prettyTime(log.time))}</div></div><button class="jf-detail-close" type="button">Close</button></div>${groups.map(([name,keys])=>`<section class="jf-detail-section"><h4>${esc(name)}</h4><div class="jf-detail-grid">${keys.map(k=>`<div class="jf-detail-item"><span class="jf-detail-label">${esc(columnLabels[k])}</span><span class="jf-detail-value">${esc(telemetryValue(k,log[k]))}</span></div>`).join("")}</div></section>`).join("")}<div style="height:18px"></div></div>`;document.body.appendChild(wrap);wrap.querySelector(".jf-detail-close").onclick=()=>wrap.remove();wrap.addEventListener("click",e=>{if(e.target===wrap)wrap.remove()})}\nfunction bindTelemetryRows(){const b=document.getElementById("telemetryTableBody");if(!b||b.dataset.coreRows)return;b.dataset.coreRows="1";b.addEventListener("click",e=>{const row=e.target.closest("tr[data-telemetry-id]");if(!row)return;const log=(activeCar?.telemetry||[]).find(x=>String(x.id)===row.dataset.telemetryId);telemetryDetail(log)})}\nfunction applyTableFilters(){renderTelemetryTable(filteredTelemetryRecords());updateVisualTelemetry(activeCar?.telemetry||currentTelemetry)}function renderFilteredTelemetryTable(){renderTelemetryTable(filteredTelemetryRecords())}\nfunction clearTelemetryFilters(){for(const id of ["telemetrySearch","startDate","startTime"]){const e=document.getElementById(id);if(e)e.value=""}for(const id of ["metricType","engineStatus","timeRange"]){const e=document.getElementById(id);if(e)e.value="all"}const m=document.getElementById("minSpeed");if(m)m.value="0";document.querySelectorAll("[data-range]").forEach(b=>b.classList.toggle("active",b.dataset.range==="all"));applyTableFilters()}function setTelemetryRange(range){const e=document.getElementById("timeRange");if(e)e.value=range;document.querySelectorAll("[data-range]").forEach(b=>b.classList.toggle("active",b.dataset.range===range));applyTableFilters()}\nfunction wireTelemetryControls(){if(document.body.dataset.telemetryCore)return;document.body.dataset.telemetryCore="1";for(const id of ["telemetrySearch","minSpeed","startDate","startTime"]){document.getElementById(id)?.addEventListener("input",applyTableFilters)}for(const id of ["metricType","engineStatus","timeRange"]){document.getElementById(id)?.addEventListener("change",applyTableFilters)}document.getElementById("jfClearFilters")?.addEventListener("click",clearTelemetryFilters);document.querySelectorAll("[data-range]").forEach(b=>b.addEventListener("click",()=>setTelemetryRange(b.dataset.range)));document.getElementById("jfTelemetryExport")?.addEventListener("click",exportTelemetryCSV);bindTelemetryRows()}function exportTelemetryCSV(){const rows=sortTelemetry(filteredTelemetryRecords());if(!rows.length)return;const csv=[columns.map(k=>columnLabels[k]).join(","),...rows.map(r=>columns.map(k=>JSON.stringify(k==='time'?r[k]??"":r[k]??"")).join(","))].join("\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download=`jafafa-telemetry-${activeCar?.id||"vehicle"}.csv`;a.click();URL.revokeObjectURL(url)}\nasync function populateTelemetry(vid){if(!activeCar)return;try{const u=new URL(TELEMETRY_ENDPOINT);u.searchParams.set("VehicleId",vid);const r=await fetch(u.toString(),{headers:{"X-API-KEY":API_KEY,Accept:"application/json"}});if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();activeCar.telemetry=d.status==="success"&&Array.isArray(d.data)?mapTelemetryData(d.data,vid):[];backendState.system.telemetry="operational"}catch(e){console.warn("Telemetry endpoint unavailable:",e);activeCar.telemetry=Array.isArray(activeCar.telemetry)?activeCar.telemetry:[];backendState.system.telemetry=activeCar.telemetry.length?"demo":"offline"}currentTelemetry=activeCar.telemetry;wireTelemetryControls();renderFilteredTelemetryTable();updateVisualTelemetry(currentTelemetry)}\n'''
          s=re.sub(r'function mapTelemetryData\(raw,vid\)\{.*?function parseJwtToken',core+'function parseJwtToken',s,count=1,flags=re.S)
          s=re.sub(r'function renderActivity\(\)\{.*?\nfunction openVehicleFromDashboard','''function renderActivity(){const a=[];MOCK_DATABASE.forEach(c=>(c.cars||[]).forEach(v=>{const latest=latestTelemetry(v.telemetry);if(latest)a.push({customer:c,vehicle:v,latest})}));a.sort((x,y)=>(parseTime(y.latest.time)?.getTime()||0)-(parseTime(x.latest.time)?.getTime()||0));const e=document.getElementById("dashboardActivity");if(!a.length){e.innerHTML='<div class="dashboard-panel"><div class="empty-state">No local telemetry activity yet. Select a vehicle to pull a live stream.</div></div>';return}e.innerHTML=a.slice(0,6).map(x=>`<button type="button" class="activity-item" onclick="openVehicleFromDashboard(${x.customer.id},'${esc(x.vehicle.id)}')"><div><div class="activity-main">${esc(x.vehicle.year)} ${esc(x.vehicle.make)} ${esc(x.vehicle.model)}</div><div class="activity-sub">${esc(x.customer.name)} · ${esc(x.vehicle.plate)} · ${num(x.latest.speed).toFixed(1)} km/h</div></div><div class="activity-time">${esc(prettyTime(x.latest.time))}</div></button>`).join("")}\nfunction openVehicleFromDashboard''',s,count=1,flags=re.S)
          dash='''async function refreshAdminDashboard(){const vs=allVehicles(),records=vs.reduce((s,v)=>s+(Array.isArray(v.telemetry)?v.telemetry.length:0),0),statuses=vs.map(v=>telemetryStatusFor(v.telemetry)),online=statuses.filter(x=>x.state==='online'||x.state==='recent').length,offline=Math.max(0,vs.length-online),warnings=vs.filter(v=>{const a=latestTelemetry(v.telemetry);return a&&Object.keys(TELEMETRY_RULES).some(k=>telemetryRule(k,a[k])==='warning')}).length,critical=0;document.getElementById("dashboardCustomerCount").textContent=MOCK_DATABASE.length.toLocaleString();document.getElementById("dashboardVehicleCount").textContent=vs.length.toLocaleString();document.getElementById("dashboardOnlineCount").textContent=online.toLocaleString();document.getElementById("dashboardTelemetryCount").textContent=records.toLocaleString();const fh=vs.length?Math.round(((online*100)+((vs.length-online-warnings-critical)*100)+(warnings*65)+(critical*25))/vs.length):0;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set("dashboardFleetTotal",vs.length);set("dashboardFleetOnline",online);set("dashboardFleetWarning",warnings);set("dashboardFleetOffline",offline);set("dashboardFleetHealth",Math.max(0,Math.min(100,fh)));const fill=document.getElementById("dashboardFleetHealthFill");if(fill)fill.style.width=`${Math.max(0,Math.min(100,fh))}%`;set("dashboardAlertCritical",`${critical} Critical`);set("dashboardAlertWarning",`${warnings} Warning`);set("dashboardAlertInfo",`${online} Online`);const connected=await fetchBackendAdminState();setDashboardStatus("dashboardBackendStatus",connected?backendState.system.backend:"pending");setDashboardStatus("dashboardDatabaseStatus",connected?backendState.system.database:"demo");setDashboardStatus("dashboardMLStatus",connected?backendState.system.mlEngine:"pending");setDashboardStatus("dashboardTelemetryStatus",backendState.system.telemetry);document.getElementById("dashboardQueued").textContent=backendState.processing.queued??"—";document.getElementById("dashboardProcessing").textContent=backendState.processing.processing??"—";document.getElementById("dashboardCompleted").textContent=backendState.processing.completedToday??"—";document.getElementById("dashboardFailed").textContent=backendState.processing.failedToday??"—";document.getElementById("dashboardModelVersion").textContent=backendState.model.version||"Not connected";document.getElementById("dashboardInferenceLatency").textContent=backendState.model.averageLatencyMs!=null?`${backendState.model.averageLatencyMs} ms`:"Not connected";renderActivity()}'''
          s=re.sub(r'async function refreshAdminDashboard\(\)\{.*?\nfunction renderActivity',dash+'\nfunction renderActivity',s,count=1,flags=re.S)
          vis='''function updateVisualTelemetry(logs){const list=Array.isArray(logs)?logs:[],latest=latestTelemetry(list),status=telemetryStatusFor(list);Visual.speed=num(latest?.speed);Visual.rpm=num(latest?.rpm);Visual.coolant=num(latest?.ctemp);Visual.load=num(latest?.load);Visual.samples=list.length;Visual.state=status.state;Visual.engine=Visual.rpm>0?(Visual.rpm<900?"idle":"running"):"off";Visual.warning=Object.keys(TELEMETRY_RULES).some(k=>telemetryRule(k,latest?.[k])==='warning');const set=(id,v)=>{const e=document.getElementById(id);if(e)e.innerHTML=v};set("jfHudSpeed",`${Visual.speed.toFixed(1)} <span>km/h</span>`);set("jfHudRpm",`${Math.round(Visual.rpm).toLocaleString()} <span>rpm</span>`);set("jfHudCoolant",`${Visual.coolant.toFixed(1)} <span>°C</span>`);set("jfHudLoad",`${Visual.load.toFixed(1)} <span>%</span>`);const stage=document.getElementById("jfTelemetryStage"),title=document.getElementById("jfStageStateTitle"),sub=document.getElementById("jfStageStateSub");if(stage)stage.className=`jf-telemetry-stage scroll-reveal state-${status.state}`;if(title)title.textContent=status.state==='offline'?"OFFLINE":Visual.warning?"ATTENTION":Visual.engine.toUpperCase();if(sub)sub.textContent=status.latest?`${activeCar?.make||"Vehicle"} ${activeCar?.model||""} · ${status.state.toUpperCase()} · ${Math.round(Visual.speed)} km/h`:"Waiting for telemetry"}\nfunction animateThree'''
          s=re.sub(r'function updateVisualTelemetry\(logs\)\{.*?\nfunction animateThree',vis,s,count=1,flags=re.S)
          s=s.replace('Visual.speed=0,rpm:0,coolant:0,load:0,samples:0};','Visual.speed=0,rpm:0,coolant:0,load:0,samples:0,state:"offline",engine:"off",warning:false};')
          marker='<div class="dashboard-section scroll-reveal"><h3>Processing pipeline</h3>'
          cmd='''<div class="dashboard-section scroll-reveal"><h3>Fleet command center</h3><div class="dashboard-panel" style="padding:18px"><div class="jf-fleet-status-grid"><div class="jf-fleet-status-card"><div class="stat-label">Fleet</div><div id="dashboardFleetTotal" class="stat-value">0</div></div><div class="jf-fleet-status-card"><div class="stat-label">Online</div><div id="dashboardFleetOnline" class="stat-value status-operational">0</div></div><div class="jf-fleet-status-card"><div class="stat-label">Warning</div><div id="dashboardFleetWarning" class="stat-value status-degraded">0</div></div><div class="jf-fleet-status-card"><div class="stat-label">Offline</div><div id="dashboardFleetOffline" class="stat-value status-offline">0</div></div></div><div style="margin-top:18px"><div class="stat-label">Fleet health</div><div class="jf-health-score"><span id="dashboardFleetHealth">0</span><span style="font-size:.9rem;color:var(--muted)"> / 100</span></div><div class="jf-health-track"><div id="dashboardFleetHealthFill" class="jf-health-fill" style="width:0%"></div></div></div><div class="jf-command-strip"><span id="dashboardAlertCritical" class="jf-command-chip critical">0 Critical</span><span id="dashboardAlertWarning" class="jf-command-chip warning">0 Warning</span><span id="dashboardAlertInfo" class="jf-command-chip info">0 Online</span></div></div></div>'''
          s=s.replace(marker,cmd+'\n'+marker,1)
          s=s.replace('if(id==="screen-telemetry")updateVisualTelemetry(currentTelemetry);','if(id==="screen-telemetry"){wireTelemetryControls();setupTelemetryTable();updateVisualTelemetry(currentTelemetry);}')
          s=s.replace('async function showTelemetryScreen(){if(!activeCar)return;','async function showTelemetryScreen(){if(!activeCar)return;wireTelemetryControls();setupTelemetryTable();')
          s=s.replace('</body>','<script>window.JaFaFaTelemetryCore={latestTelemetry,normalizeTelemetryRecord,mapTelemetryData,telemetryStatusFor};</script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['./fleet-management.js','const S={sortKey:\'time\'','function latestTelemetry(','function normalizeTelemetryRecord(','function renderTelemetryTable(','data-range="1h"','dashboardFleetHealth']:
              if (x.startswith('function') or x.startswith('data-') or x.startswith('dashboard')) and x not in s: raise SystemExit('missing '+x)
              if x.startswith('./') and x in s: raise SystemExit('external fleet file remains')
              if x.startswith('const S') and x in s: raise SystemExit('telemetry wrapper remains')
          print('OK',len(s))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate telemetry architecture and fleet UX'
          git push
