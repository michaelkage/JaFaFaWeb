name: JaFaFa v5 cleanup and health unification
on:
  push:
    paths:
      - '.jafafa-v5-trigger'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup and health architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          def clean_css(text):
              text = re.sub(r'(?m)^(?P<i>[ \t]*)-webkit-backdrop-filter:\s*(?P<v>[^;]+);\s*\n(?P=i)-webkit-backdrop-filter:\s*[^;]+;\s*(?:backdrop-filter:\s*)?(?P<v2>[^;]+);', lambda m: f"{m.group('i')}-webkit-backdrop-filter: {m.group('v')};\n{m.group('i')}backdrop-filter: {m.group('v2')};", text)
              text = re.sub(r'-webkit-backdrop-filter:\s*([^;]+);\s*-webkit-backdrop-filter:\s*[^;]+;\s*backdrop-filter:\s*([^;]+);', lambda m: f'-webkit-backdrop-filter: {m.group(1)};\n        backdrop-filter: {m.group(2)};', text)
              text = text.replace('.jf-modal-backdrop[hidden]{display:none!important}.jf-modal-backdrop[hidden]{display:none!important}', '.jf-modal-backdrop[hidden]{display:none!important}')
              return text

          for name in ('index.html','customer.html'):
              p=Path(name); p.write_text(clean_css(p.read_text(encoding='utf-8')),encoding='utf-8')

          admin=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'function analyzeVehicleTelemetry\(logs\)\{.*?window\.analyzeVehicleTelemetry=analyzeVehicleTelemetry;',admin,re.S)
          if not m: raise SystemExit('admin telemetry analysis block not found')
          new=r'''function telemetryConnectionState(age){if(!Number.isFinite(age)||age<0)return "offline";if(age<10000)return "live";if(age<30000)return "recent";if(age<120000)return "stale";return "offline"}
      function vehicleHealthScore(logs){const latest=latestTelemetry(logs);if(!latest)return null;const coolant=normalizeTelemetryValue(latest.ctemp),voltage=normalizeTelemetryValue(latest.voltage),rpm=normalizeTelemetryValue(latest.rpm),speed=normalizeTelemetryValue(latest.speed),d=parseTime(latest.time),age=d?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age);let score=100;if(coolant!==null){if(coolant>=TELEMETRY_CONFIG.ctemp.critical)score-=30;else if(coolant>=TELEMETRY_CONFIG.ctemp.warning)score-=10}if(voltage!==null&&voltage>0&&voltage<TELEMETRY_CONFIG.voltage.warningBelow)score-=20;if(rpm!==null&&rpm>=TELEMETRY_CONFIG.rpm.warning)score-=10;if(speed!==null&&speed>=TELEMETRY_CONFIG.speed.warning)score-=5;if(connection==="stale")score-=5;if(connection==="offline")score-=10;return Math.max(0,Math.min(100,Math.round(score)))}
      function vehicleHealthCategories(logs){const latest=latestTelemetry(logs);if(!latest)return[];const coolant=normalizeTelemetryValue(latest.ctemp),voltage=normalizeTelemetryValue(latest.voltage),rpm=normalizeTelemetryValue(latest.rpm),speed=normalizeTelemetryValue(latest.speed),d=parseTime(latest.time),age=d?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),clamp=n=>Math.max(0,Math.min(100,Math.round(n)));return [["Engine",clamp(100-(rpm!==null&&rpm>=TELEMETRY_CONFIG.rpm.warning?10:0))],["Cooling",clamp(100-(coolant===null?0:coolant>=TELEMETRY_CONFIG.ctemp.critical?30:coolant>=TELEMETRY_CONFIG.ctemp.warning?10:0))],["Electrical",clamp(100-(voltage!==null&&voltage>0&&voltage<TELEMETRY_CONFIG.voltage.warningBelow?20:0))],["Air / Intake",100],["Performance",clamp(100-(speed!==null&&speed>=TELEMETRY_CONFIG.speed.warning?5:0))],["Connectivity",connection==="live"?100:connection==="recent"?90:connection==="stale"?75:50]]}
      function analyzeVehicleTelemetry(logs){const latest=latestTelemetry(logs),l=latest||{},speed=normalizeTelemetryValue(l.speed)??0,rpm=normalizeTelemetryValue(l.rpm)??0,coolant=normalizeTelemetryValue(l.ctemp),voltage=normalizeTelemetryValue(l.voltage),d=parseTime(l.time),age=d?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),engine=rpm<=0?"off":rpm<900?"idle":"running",driving=speed<=0?"stationary":speed>=100?"high-speed":"moving",cooling=coolant===null?"unknown":coolant>=TELEMETRY_CONFIG.ctemp.critical?"overheating":coolant>=TELEMETRY_CONFIG.ctemp.warning?"warm":"normal",electrical=voltage===null||voltage<=0?"unknown":voltage<TELEMETRY_CONFIG.voltage.warningBelow?"low-voltage":"normal",sevs=[telemetrySeverity("speed",speed),telemetrySeverity("rpm",rpm),telemetrySeverity("ctemp",coolant),telemetrySeverity("voltage",voltage)],overall=sevs.includes("critical")?"critical":sevs.includes("warning")||connection==="offline"?"warning":"healthy",score=vehicleHealthScore(logs),categories=vehicleHealthCategories(logs);return{latest,connection,engine,driving,cooling,electrical,overall,age,score,categories}}'''
          admin=admin[:m.start()]+new+admin[m.end():]
          old='const states=vs.map(v=>analyzeVehicleTelemetry(v.telemetry)),online=states.filter(a=>a.connection==="online"||a.connection==="recent").length,critical=states.filter(a=>a.overall==="critical").length,warning=states.filter(a=>a.overall==="warning"&&a.connection!=="offline").length,offline=states.filter(a=>a.connection==="offline").length,healthy=Math.max(0,Math.min(100,vs.length?Math.round(states.reduce((sum,a)=>sum+(a.overall==="healthy"?100:a.overall==="warning"?70:25),0)/vs.length):0));host.innerHTML=`<h3>Fleet command center</h3><div class="jf-fleet-command-grid"><div class="jf-fleet-command-card"><b>${vs.length}</b><span>Fleet</span></div><div class="jf-fleet-command-card"><b>${online}</b><span>Online</span></div><div class="jf-fleet-command-card"><b>${warning}</b><span>Warning</span></div><div class="jf-fleet-command-card"><b>${offline}</b><span>Offline</span></div></div><div class="jf-fleet-health"><div class="stat-label">Fleet health</div><div style="display:flex;justify-content:space-between;align-items:end"><strong style="font-size:1.8rem">${healthy}</strong><span style="color:var(--muted);font-size:.7rem">/ 100 · ${critical} critical</span></div><div class="jf-health-track"><div class="jf-health-fill" style="width:${healthy}%"></div></div></div>`'
          newcmd='const states=vs.map(v=>analyzeVehicleTelemetry(v.telemetry)),live=states.filter(a=>a.connection==="live").length,recent=states.filter(a=>a.connection==="recent").length,stale=states.filter(a=>a.connection==="stale").length,critical=states.filter(a=>a.overall==="critical").length,warning=states.filter(a=>a.overall==="warning"&&a.connection!=="offline").length,offline=states.filter(a=>a.connection==="offline").length,scores=states.map(a=>a.score).filter(Number.isFinite),healthy=scores.length?Math.round(scores.reduce((sum,a)=>sum+a,0)/scores.length):0;host.innerHTML=`<h3>Fleet command center</h3><div class="jf-fleet-command-grid"><div class="jf-fleet-command-card"><b>${vs.length}</b><span>Fleet</span></div><div class="jf-fleet-command-card"><b>${live}</b><span>Live</span></div><div class="jf-fleet-command-card"><b>${recent}</b><span>Recent</span></div><div class="jf-fleet-command-card"><b>${stale}</b><span>Stale</span></div><div class="jf-fleet-command-card"><b>${warning}</b><span>Warning</span></div><div class="jf-fleet-command-card"><b>${critical}</b><span>Critical</span></div><div class="jf-fleet-command-card"><b>${offline}</b><span>Offline</span></div></div><div class="jf-fleet-health"><div class="stat-label">Fleet health</div><div style="display:flex;justify-content:space-between;align-items:end"><strong style="font-size:1.8rem">${healthy}</strong><span style="color:var(--muted);font-size:.7rem">/ 100</span></div><div class="jf-health-track"><div class="jf-health-fill" style="width:${healthy}%"></div></div></div>`'
          if old not in admin: raise SystemExit('command center block not found')
          admin=admin.replace(old,new,1)
          admin=admin.replace("function connectivity(v){ const d=lastSeen(v); if(!d || Number.isNaN(d.getTime())) return 'offline'; const mins=(Date.now()-d.getTime())/60000; if(mins<=10)return 'online'; if(mins<=60)return 'recent'; return 'offline'; }", "function connectivity(v){ const a=window.analyzeVehicleTelemetry?.(v?.telemetry||[]); return a?.connection || 'offline'; }")
          old="""updateCustomer(id, data) {\n       const c = this.getCustomer(id); if (!c) throw new Error('Customer not found.');\n       Object.assign(c, data); localStorage.setItem(DB_KEY, JSON.stringify(normalize())); return c;\n     },"""
          new="""updateCustomer(id, data) {\n       const c = this.getCustomer(id); if (!c) throw new Error('Customer not found.');\n       const email = String(data.email ?? c.email ?? '').trim().toLowerCase();\n       if (email && normalize().some(x => String(x.id) !== String(id) && String(x.email || '').trim().toLowerCase() === email)) throw new Error('A customer with that email already exists.');\n       Object.assign(c, data, { email });\n       localStorage.setItem(DB_KEY, JSON.stringify(normalize())); return c;\n     },"""
          if old in admin: admin=admin.replace(old,new,1)
          admin=admin.replace('function refreshTelemetryHealth(){const a=analyzeVehicleTelemetry(currentTelemetry),score=a.overall==="critical"?25:a.overall==="warning"?72:92;', 'function refreshTelemetryHealth(){const a=analyzeVehicleTelemetry(currentTelemetry),score=Number.isFinite(a.score)?a.score:null;')
          admin=admin.replace('set("jfHealthScore",`${score} / 100`);','set("jfHealthScore",score===null?"— / 100":`${score} / 100`);')
          admin=admin.replace('if(fill)fill.style.width=`${score}%`;','if(fill)fill.style.width=`${score===null?0:score}%`;')
          admin=admin.replace('.jf-fleet-command{display:grid;grid-template-columns:repeat(5,1fr);','.jf-fleet-command{display:grid;grid-template-columns:repeat(7,1fr);')
          admin=admin.replace('@media(max-width:900px){.jf-fleet-command{grid-template-columns:repeat(3,1fr)}','@media(max-width:900px){.jf-fleet-command{grid-template-columns:repeat(4,1fr)}')
          admin=admin.replace('const GOOGLE_CLIENT_ID =','// ============================================================\n      // AUTHENTICATION\n      // ============================================================\n      const GOOGLE_CLIENT_ID =',1)
          admin=admin.replace('const TELEMETRY_CONFIG=','// ============================================================\n      // TELEMETRY CORE + HEALTH ENGINE\n      // ============================================================\n      const TELEMETRY_CONFIG=',1)
          admin=admin.replace('const originalShowTelemetry = window.showTelemetryScreen;','// ============================================================\n         // UI RENDERING + TELEMETRY PRESENTATION\n         // ============================================================\n         const originalShowTelemetry = window.showTelemetryScreen;',1)
          admin=admin.replace('/* JaFaFa Admin Fleet Suite — consolidated customer/vehicle operations layer. */','/* ============================================================\n   CUSTOMER MANAGEMENT + VEHICLE MANAGEMENT + ALERTS\n   ============================================================ */\n   /* JaFaFa Admin Fleet Suite — consolidated customer/vehicle operations layer. */',1)
          admin=admin.replace('/* JaFaFaWeb 2.0 — Plans 1–6 integration layer. */','/* ============================================================\n   ACCESS REQUESTS + PLATFORM DATA LAYER\n   ============================================================ */\n   /* JaFaFaWeb 2.0 — Plans 1–6 integration layer. */',1)
          Path('index.html').write_text(admin,encoding='utf-8')

          customer=Path('customer.html').read_text(encoding='utf-8')
          customer=customer.replace('<b id="statOnline">0</b><span>Online now</span>','<b id="statOnline">0</b><span>Live now</span>')
          customer=customer.replace('<b id="statWarnings">0</b><span>Warnings</span>','<b id="statWarnings">0</b><span>Recent</span>')
          customer=customer.replace('<div class="stat">\n            <b id="statHealth">—</b><span>Fleet health</span>\n          </div>','<div class="stat">\n            <b id="statOffline">0</b><span>Offline</span>\n          </div>')
          customer=customer.replace('<div class="bars" id="healthBars"></div>','<div class="bars" id="healthBars"></div><div id="healthReasons" class="health-reasons"></div>')
          marker='function analyze(v) {'
          core=r'''const TELEMETRY_CONFIG=Object.freeze({speed:{label:"Speed",unit:"km/h",category:"driving",warning:100},rpm:{label:"RPM",unit:"rpm",category:"engine",warning:5000},ctemp:{label:"Coolant",unit:"°C",category:"cooling",warning:105,critical:110},voltage:{label:"Voltage",unit:"V",category:"electrical",warningBelow:12},maf:{label:"MAF",unit:"g/s",category:"air"},fuel:{label:"Fuel",unit:"%",category:"fuel"},evap:{label:"EVAP",unit:"%",category:"emissions"},timing:{label:"Timing",unit:"°",category:"engine"},etemp:{label:"Engine temp",unit:"°C",category:"engine"},mpg:{label:"MPG",unit:"mpg",category:"fuel"},iat:{label:"Intake",unit:"°C",category:"air"},throttle:{label:"Throttle",unit:"%",category:"air"},load:{label:"Load",unit:"%",category:"engine"},atemp:{label:"Atmo",unit:"kPa",category:"environment"},bpressure:{label:"Baro",unit:"kPa",category:"environment"}});
      window.TELEMETRY_CONFIG=TELEMETRY_CONFIG;
      function normalizeTelemetryValue(v){if(v===null||v===undefined||v==="")return null;const n=Number(v);return Number.isFinite(n)?n:null}
      function telemetryConnectionState(age){if(!Number.isFinite(age)||age<0)return "offline";if(age<10000)return "live";if(age<30000)return "recent";if(age<120000)return "stale";return "offline"}
      function telemetrySeverity(key,value){const cfg=TELEMETRY_CONFIG[key],n=normalizeTelemetryValue(value);if(!cfg||n===null)return "normal";if(cfg.critical!==undefined&&n>=cfg.critical)return "critical";if(cfg.warning!==undefined&&n>=cfg.warning)return "warning";if(cfg.warningBelow!==undefined&&n>0&&n<cfg.warningBelow)return "warning";return "normal"}
      function vehicleHealthScore(logs){const latest=latestTelemetry(logs);if(!latest)return null;const coolant=normalizeTelemetryValue(latest.ctemp),voltage=normalizeTelemetryValue(latest.voltage),rpm=normalizeTelemetryValue(latest.rpm),speed=normalizeTelemetryValue(latest.speed),d=latest.time||latest.timestamp?new Date(latest.time||latest.timestamp):null,age=d&&!Number.isNaN(d.getTime())?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age);let score=100;if(coolant!==null){if(coolant>=TELEMETRY_CONFIG.ctemp.critical)score-=30;else if(coolant>=TELEMETRY_CONFIG.ctemp.warning)score-=10}if(voltage!==null&&voltage>0&&voltage<TELEMETRY_CONFIG.voltage.warningBelow)score-=20;if(rpm!==null&&rpm>=TELEMETRY_CONFIG.rpm.warning)score-=10;if(speed!==null&&speed>=TELEMETRY_CONFIG.speed.warning)score-=5;if(connection==="stale")score-=5;if(connection==="offline")score-=10;return Math.max(0,Math.min(100,Math.round(score)))}
      function vehicleHealthCategories(logs){const latest=latestTelemetry(logs);if(!latest)return[];const coolant=normalizeTelemetryValue(latest.ctemp),voltage=normalizeTelemetryValue(latest.voltage),rpm=normalizeTelemetryValue(latest.rpm),speed=normalizeTelemetryValue(latest.speed),d=latest.time||latest.timestamp?new Date(latest.time||latest.timestamp):null,age=d&&!Number.isNaN(d.getTime())?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),clamp=n=>Math.max(0,Math.min(100,Math.round(n)));return [["Engine",clamp(100-(rpm!==null&&rpm>=TELEMETRY_CONFIG.rpm.warning?10:0))],["Cooling",clamp(100-(coolant===null?0:coolant>=TELEMETRY_CONFIG.ctemp.critical?30:coolant>=TELEMETRY_CONFIG.ctemp.warning?10:0))],["Electrical",clamp(100-(voltage!==null&&voltage>0&&voltage<TELEMETRY_CONFIG.voltage.warningBelow?20:0))],["Air / Intake",100],["Performance",clamp(100-(speed!==null&&speed>=TELEMETRY_CONFIG.speed.warning?5:0))],["Connectivity",connection==="live"?100:connection==="recent"?90:connection==="stale"?75:50]]}
      function analyzeVehicleTelemetry(logs){const latest=latestTelemetry(logs),l=latest||{},speed=normalizeTelemetryValue(l.speed)??0,rpm=normalizeTelemetryValue(l.rpm)??0,coolant=normalizeTelemetryValue(l.ctemp),voltage=normalizeTelemetryValue(l.voltage),d=latest&&(latest.time||latest.timestamp)?new Date(latest.time||latest.timestamp):null,age=d&&!Number.isNaN(d.getTime())?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),engine=rpm<=0?"off":rpm<900?"idle":"running",driving=speed<=0?"stationary":speed>=100?"high-speed":"moving",cooling=coolant===null?"unknown":coolant>=TELEMETRY_CONFIG.ctemp.critical?"overheating":coolant>=TELEMETRY_CONFIG.ctemp.warning?"warm":"normal",electrical=voltage===null||voltage<=0?"unknown":voltage<TELEMETRY_CONFIG.voltage.warningBelow?"low-voltage":"normal",sevs=[telemetrySeverity("speed",speed),telemetrySeverity("rpm",rpm),telemetrySeverity("ctemp",coolant),telemetrySeverity("voltage",voltage)],overall=sevs.includes("critical")?"critical":sevs.includes("warning")||connection==="offline"?"warning":"healthy";return{latest,connection,engine,driving,cooling,electrical,overall,age,score:vehicleHealthScore(logs),categories:vehicleHealthCategories(logs)}}
      window.vehicleHealthScore=vehicleHealthScore; window.vehicleHealthCategories=vehicleHealthCategories; window.analyzeVehicleTelemetry=analyzeVehicleTelemetry;
      function analyze(v) {'''
          customer=customer.replace(marker,core,1)
          start=customer.index('function health(v) {'); end=customer.index('function meta(v)',start)
          customer=customer[:start]+'function health(v) { return v ? vehicleHealthScore(v.telemetry||[]) : null; }\n      function healthCategories(v) { return vehicleHealthCategories(v?.telemetry||[]); }\n      '+customer[end:]
          customer=customer.replace('const online=vs.filter(v=>analyze(v).connection==="online").length, warnings=vs.filter(v=>analyze(v).overall!=="healthy").length, offline=vs.filter(v=>analyze(v).connection==="offline").length;','const online=vs.filter(v=>analyze(v).connection==="live").length, warnings=vs.filter(v=>analyze(v).connection==="recent").length, offline=vs.filter(v=>analyze(v).connection==="offline").length;')
          customer=customer.replace('$("statVehicles").textContent=vs.length; $("statOnline").textContent=online; $("statWarnings").textContent=warnings; $("statHealth").textContent=vs.length?Math.round(vs.map(health).filter(x=>x!==null).reduce((a,x)=>a+x,0)/(vs.map(health).filter(x=>x!==null).length||1)):"—";','$("statVehicles").textContent=vs.length; $("statOnline").textContent=online; $("statWarnings").textContent=warnings; $("statOffline").textContent=offline;')
          customer=customer.replace('function meta(v) { const a=analyze(v); return a.connection==="offline"?["OFFLINE","off"]:(a.overall==="warning"?["WARNING","warn"]:[a.connection==="recent"?"RECENT":"ONLINE",""]); }','function meta(v) { const a=analyze(v); if(a.connection==="offline")return ["OFFLINE","off"]; if(a.overall==="critical")return ["CRITICAL","critical"]; if(a.overall==="warning")return ["WARNING","warn"]; if(a.connection==="stale")return ["STALE","warn"]; if(a.connection==="recent")return ["RECENT",""]; return ["LIVE",""]; }')
          oldprofile='c.name=$("profileName").value.trim();c.email=$("profileEmail").value.trim().toLowerCase();c.phone=$("profilePhone").value.trim();account=c;syncCustomerState();saveDb();persistSession();renderAccount();renderDashboard();toast("Profile saved");'
          newprofile='const nextEmail=$("profileEmail").value.trim().toLowerCase();const duplicate=db.some(x=>String(x.id)!==String(c.id)&&String(x.email||"").trim().toLowerCase()===nextEmail);if(duplicate)return toast("That email is already used by another customer.");c.name=$("profileName").value.trim();c.email=nextEmail;c.phone=$("profilePhone").value.trim();account=c;syncCustomerState();saveDb();persistSession();renderAccount();renderDashboard();toast("Profile saved");'
          customer=customer.replace(oldprofile,newprofile)
          customer=re.sub(r"function health\(v\)\{if\(typeof window\.health===\'function\'\).*?return Math\.max\(0,Math\.min\(100,s\)\)\}", "function health(v){try{return typeof window.vehicleHealthScore==='function'?window.vehicleHealthScore(v?.telemetry||[]):(typeof window.health==='function'?window.health(v):null)}catch{return null}}", customer)
          old='$("healthBars").innerHTML=healthCategories(v).map(x=>`<div class="barrow"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}</b></div>`).join("");'
          new='$("healthBars").innerHTML=healthCategories(v).map(x=>`<div class="barrow"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}</b></div>`).join("");const reasons=[];const a=analyze(v);if(a.cooling==="normal")reasons.push("✓ Coolant temperature normal");else if(a.cooling==="warm")reasons.push("⚠ Coolant temperature elevated");else if(a.cooling==="overheating")reasons.push("🔴 Coolant temperature critical");if(a.electrical==="normal")reasons.push("✓ Battery voltage healthy");else if(a.electrical==="low-voltage")reasons.push("⚠ Battery voltage below normal");if(a.connection==="live"||a.connection==="recent")reasons.push("✓ Telemetry connection active");else if(a.connection==="stale")reasons.push("⚠ Telemetry connection is stale");else reasons.push("🔴 Telemetry connection offline");$("healthReasons").innerHTML=`<div class="eyebrow">Why this score?</div>${reasons.map(x=>`<div class="health-reason">${esc(x)}</div>`).join("")}`;'
          customer=customer.replace(old,new)
          customer=customer.replace('const DB_KEY =','// ============================================================\n      // AUTHENTICATION + DATABASE\n      // ============================================================\n      const DB_KEY =',1)
          customer=customer.replace('const TELEMETRY_CONFIG=','// ============================================================\n      // TELEMETRY CORE + HEALTH ENGINE\n      // ============================================================\n      const TELEMETRY_CONFIG=',1)
          customer=customer.replace('function renderDashboard(){','// ============================================================\n      // UI RENDERING\n      // ============================================================\n      function renderDashboard(){',1)
          customer=customer.replace('async function handlePasswordAuth(e){','// ============================================================\n      // AUTH HANDLERS\n      // ============================================================\n      async function handlePasswordAuth(e){',1)
          customer=customer.replace('.jf-cx-error{border:1px solid rgba(251,113,133,.25);','.health-reasons{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.health-reason{color:var(--muted);font-size:.72rem;margin-top:6px}.dot.critical{background:var(--red);box-shadow:0 0 10px var(--red)}.jf-cx-error{border:1px solid rgba(251,113,133,.25);',1)
          Path('customer.html').write_text(customer,encoding='utf-8')

          for name in ('index.html','customer.html'):
              s=Path(name).read_text(encoding='utf-8')
              for i,src in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)):
                  f=Path(tempfile.gettempdir())/f'jafafa-{name}-{i}.js'; f.write_text(src,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: print(r.stderr); raise SystemExit(f'JavaScript syntax error in {name} script {i}')
          print('v5 syntax validation passed')
          PY
      - name: Validate files
        run: |
          test "$(grep -o '<html' index.html | wc -l)" -eq 1
          test "$(grep -o '</html>' index.html | wc -l)" -eq 1
          test "$(grep -o '<html' customer.html | wc -l)" -eq 1
          test "$(grep -o '</html>' customer.html | wc -l)" -eq 1
          ! grep -n -- '-webkit-backdrop-filter:blur' index.html customer.html
          grep -q 'telemetryConnectionState' index.html
          grep -q 'vehicleHealthScore' index.html
          grep -q 'vehicleHealthScore' customer.html
          grep -q 'That email is already used by another customer' customer.html
          git diff --check
      - name: Remove temporary workflow and trigger
        run: rm -f .github/workflows/apply-v5-cleanup.yml .jafafa-v5-trigger
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html
          git add -A .github/workflows/apply-v5-cleanup.yml .jafafa-v5-trigger || true
          git diff --cached --quiet && exit 0
          git commit -m 'Clean CSS and unify telemetry health engine [jafafa-v5]'
          git push
