name: Embed activation JavaScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  embed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed activation-codes.js into HTML portals
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          js=Path('activation-codes.js').read_text(encoding='utf-8')
          for filename in ('index.html','customer.html'):
              p=Path(filename); s=p.read_text(encoding='utf-8')
              s=re.sub(r'\s*<script\s+src=["\']activation-codes\.js["\']\s*></script>','',s,flags=re.I)
              marker='<!-- JAFAFA ACTIVATION CODE LAYER -->'
              if marker not in s:
                  s=s.replace('</body>', marker+'\n<script>\n'+js+'\n</script>\n</body>',1)
              p.write_text(s,encoding='utf-8')
          # Syntax check the resulting inline activation layer.
          for filename in ('index.html','customer.html','customerboring.html','indexboring.html'):
              text=Path(filename).read_text(encoding='utf-8')
              for i,block in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)):
                  if not block.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:f.write(block);name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode: print(f'{filename} block {i}:\n{r.stderr}');raise SystemExit(1)
          print('Activation JavaScript embedded successfully.')
      - name: Commit and remove external JS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html
          git rm -f activation-codes.js .github/workflows/embed-activation-js.yml || true
          git commit -m 'Embed activation code layer into portal HTML'
          git push
