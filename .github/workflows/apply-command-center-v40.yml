name: Apply JaFaFa command center v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[jafafa-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v4 pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          CSS = r'''<style id="jafafa-v4-style">
          :root{--jf-live:#4ade80;--jf-recent:#38bdf8;--jf-stale:#a78bfa;--jf-warning:#fbbf24;--jf-critical:#fb7185}
          .jf-v4-summary{display:grid;grid-template-columns:minmax(1.5fr,2fr) repeat(4,1fr);gap:10px;margin:18px 0}
          .jf-v4-summary>div{border:1px solid var(--line);border-radius:15px;background:rgba(7,14,26,.72);padding:16px;min-width:0}
          .jf-v4-summary .hero-score{grid-row:span 2}.jf-v4-kicker{color:var(--muted);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:850}.jf-v4-score{font-size:2.7rem;font-weight:950;letter-spacing:-.06em;margin-top:4px}.jf-v4-summary strong{display:block;font-size:1.45rem;margin-top:4px}.jf-v4-summary span{display:block;color:var(--muted);font-size:.62rem;margin-top:3px}
          .jf-v4-attention{margin:18px 0}.jf-v4-attention-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.jf-v4-attention-card{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(7,14,26,.66)}.jf-v4-attention-card.critical{border-color:rgba(251,113,133,.3)}.jf-v4-attention-card.warning{border-color:rgba(251,191,36,.25)}.jf-v4-attention-card b{display:block;font-size:.76rem}.jf-v4-attention-card small{display:block;color:var(--muted);margin-top:3px}
          .jf-v4-actionbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}.jf-v4-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.jf-v4-actions button{border:1px solid var(--line);background:rgba(15,23,42,.55);color:var(--muted);padding:7px 9px;border-radius:9px;font-size:.62rem;font-weight:800}.jf-v4-actions button.active{color:var(--text);border-color:var(--line-bright);background:rgba(56,189,248,.08)}
          .jf-v4-palette,.jf-v4-notify{position:fixed;inset:0;z-index:2000;background:rgba(2,6,23,.68);backdrop-filter:blur(10px);display:none;padding:10vh 18px;align-items:flex-start;justify-content:center}.jf-v4-palette.open,.jf-v4-notify.open{display:flex}.jf-v4-palette-card{width:min(720px,100%);border:1px solid var(--line-bright);border-radius:18px;background:rgba(7,14,26,.98);box-shadow:0 40px 130px rgba(0,0,0,.6);overflow:hidden}.jf-v4-palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:17px 19px;font-size:.95rem;outline:0}.jf-v4-results{max-height:55vh;overflow:auto;padding:8px}.jf-v4-result{width:100%;border:0;background:transparent;color:var(--text);display:flex;justify-content:space-between;text-align:left;padding:12px;border-radius:10px}.jf-v4-result:hover,.jf-v4-result.active{background:rgba(56,189,248,.09)}.jf-v4-result small{color:var(--muted)}
          .jf-v4-notify-card{width:min(460px,100%);margin-left:auto;border:1px solid var(--line);border-radius:18px;background:rgba(7,14,26,.98);box-shadow:0 40px 130px rgba(0,0,0,.6);padding:17px}.jf-v4-notify-head{display:flex;justify-content:space-between;align-items:center}.jf-v4-note{padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:rgba(15,23,42,.38)}.jf-v4-note.critical{border-color:rgba(251,113,133,.3)}.jf-v4-note.warning{border-color:rgba(251,191,36,.24)}.jf-v4-note b,.jf-v4-note small{display:block}.jf-v4-note small{color:var(--muted);margin-top:3px}
          .jf-v4-live{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.jf-v4-live i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.jf-v4-live.live{color:var(--jf-live)}.jf-v4-live.recent{color:var(--jf-recent)}.jf-v4-live.stale{color:var(--jf-stale)}.jf-v4-live.offline{color:#64748b}
          .jf-v4-health-explain{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(3,7,18,.28)}.jf-v4-health-explain strong{display:block}.jf-v4-health-explain span{display:block;color:var(--muted);font-size:.68rem;margin-top:4px}.jf-v4-health-reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.jf-v4-health-reasons i{font-style:normal;font-size:.62rem;padding:5px 7px;border:1px solid var(--line);border-radius:999px;color:#b9c7d9}.jf-v4-health-reasons i.warn{color:#fde68a;border-color:rgba(251,191,36,.2)}
          .jf-v4-customer-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}.jf-v4-customer-summary>div{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(7,14,26,.62)}.jf-v4-customer-summary strong{display:block;font-size:1.45rem}.jf-v4-customer-summary span{color:var(--muted);font-size:.62rem}.jf-v4-happening{margin:16px 0;padding:15px;border:1px solid var(--line);border-radius:15px;background:rgba(7,14,26,.62)}.jf-v4-happening h3{margin:0 0 9px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}.jf-v4-happening p{margin:6px 0;color:#b9c7d9;font-size:.72rem}.jf-v4-happening p.warn{color:#fde68a}
          body.jf-v4-warning #jf-visual-layer{filter:saturate(1.08)} body.jf-v4-warning #jf-visual-layer:after{content:"";position:absolute;inset:0;background:rgba(251,191,36,.025);pointer-events:none} body.jf-v4-critical #jf-visual-layer:after{content:"";position:absolute;inset:0;background:rgba(251,30,60,.045);pointer-events:none;animation:jfV4Pulse 2.5s ease-in-out infinite} body.jf-v4-offline #jf-visual-layer{filter:saturate(.35);opacity:.72}@keyframes jfV4Pulse{50%{opacity:.3}}
          @media(max-width:900px){.jf-v4-summary{grid-template-columns:repeat(4,1fr)}.jf-v4-summary .hero-score{grid-column:1/-1;grid-row:auto}.jf-v4-customer-summary{grid-template-columns:1fr 1fr}}
          @media(max-width:650px){.jf-v4-summary{grid-template-columns:1fr 1fr}.jf-v4-attention-grid{grid-template-columns:1fr}.jf-v4-customer-summary{grid-template-columns:1fr 1fr}}
          @media(prefers-reduced-motion:reduce){body.jf-v4-critical #jf-visual-layer:after{animation:none}}
          </style>'''

          JS = r'''<script id="jafafa-v4-script">
          (()=>{
            "use strict";
            if(window.__JAFAFA_V4__) return; window.__JAFAFA_V4__=true;
            const $=id=>document.getElementById(id);
            const esc4=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
            const n4=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
            const t4=v=>{if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d};
            function latest4(list){if(!Array.isArray(list)||!list.length)return null;return list.reduce((best,row)=>{const a=t4(row?.time??row?.timestamp),b=t4(best?.time??best?.timestamp);if(!a)return best;if(!b||a>b)return row;return best},null)}
            function state4(v){const l=latest4(v?.telemetry);if(!l)return {key:"offline",label:"OFFLINE",age:Infinity,latest:null};const d=t4(l.time??l.timestamp);if(!d)return {key:"stale",label:"STALE",age:Infinity,latest:l};const age=Math.max(0,(Date.now()-d.getTime())/1000);return age<10?{key:"live",label:"LIVE",age,latest:l}:age<30?{key:"recent",label:"RECENT",age,latest:l}:age<120?{key:"stale",label:"STALE",age,latest:l}:{key:"offline",label:"OFFLINE",age,latest:l}}
            function health4(v){const l=latest4(v?.telemetry);if(!l)return {score:null,reasons:["No recent telemetry"],severity:"offline"};let score=100,reasons=[],sev="healthy";const voltage=n4(l.voltage),cool=n4(l.ctemp??l.coolant??l.coolantTemp),speed=n4(l.speed),rpm=n4(l.rpm),load=n4(l.load);if(cool!==null&&cool>=110){score-=20;reasons.push("Coolant temperature critical");sev="critical"}else if(cool!==null&&cool>=105){score-=10;reasons.push("Coolant temperature elevated");sev="warning"}if(voltage!==null&&voltage<12){score-=12;reasons.push("Battery voltage below normal");sev=sev==="critical"?sev:"warning"}if(speed!==null&&speed>=120){score-=8;reasons.push("High vehicle speed");sev=sev==="critical"?sev:"warning"}if(rpm!==null&&rpm>=5000){score-=6;reasons.push("High engine RPM");sev=sev==="critical"?sev:"warning"}if(load!==null&&load>=90){score-=5;reasons.push("High engine load");sev=sev==="critical"?sev:"warning"}return {score:Math.max(0,Math.min(100,score)),reasons,severity:sev}}
            window.JaFaFaCore=window.JaFaFaCore||{};Object.assign(window.JaFaFaCore,{latestTelemetry:latest4,statusFor:state4,healthFor:health4});window.latestTelemetry=latest4;
            function fleet(){return Array.isArray(window.MOCK_DATABASE)?window.MOCK_DATABASE.flatMap(c=>(c.cars||[]).map(v=>({c,v}))):[]}
            function fleetStats(){const all=fleet(), hs=all.map(x=>health4(x.v)), ss=all.map(x=>state4(x.v)), claims=(()=>{try{return JSON.parse(localStorage.getItem("jafafa_claims")||"[]")}catch{return[]}})();const live=ss.filter(s=>s.key==="live"||s.key==="recent").length,warn=hs.filter(h=>h.severity==="warning").length,critical=hs.filter(h=>h.severity==="critical").length,offline=ss.filter(s=>s.key==="offline").length,score=all.length?Math.round(hs.filter(h=>h.score!=null).reduce((a,h)=>a+h.score,0)/Math.max(1,hs.filter(h=>h.score!=null).length)):0;return {all,live,warn,critical,offline,score,claims:claims.filter(c=>c.status==="PENDING").length}}
            function updateFleetState(){const s=fleetStats();document.body.classList.toggle("jf-v4-warning",s.warn>0);document.body.classList.toggle("jf-v4-critical",s.critical>0);document.body.classList.toggle("jf-v4-offline",s.all.length>0&&s.offline===s.all.length)}
            function addAdminSummary(){if(!$('screen-dashboard')||$('jfV4Summary'))return;const hero=$('screen-dashboard').querySelector('.dashboard-hero');if(!hero)return;const wrap=document.createElement('div');wrap.id='jfV4Summary';wrap.className='jf-v4-summary scroll-reveal';hero.after(wrap);renderAdminSummary()}
            function renderAdminSummary(){const host=$('jfV4Summary');if(!host)return;const s=fleetStats();host.innerHTML=`<div class="hero-score"><div class="jf-v4-kicker">Fleet health</div><div class="jf-v4-score">${s.score||0}<small style="font-size:.8rem;color:var(--muted)"> / 100</small></div><div class="jf-healthbar" style="margin-top:9px;--jf-health:${s.score||0}%"><i></i></div><span>${s.critical?'Critical attention required':s.warn?'Good — minor attention recommended':'All monitored vehicles look healthy'}</span></div><div><div class="jf-v4-kicker">Vehicles</div><strong>${s.all.length}</strong><span>Total fleet</span></div><div><div class="jf-v4-kicker">Live</div><strong>${s.live}</strong><span>Live or recent</span></div><div><div class="jf-v4-kicker">Warnings</div><strong>${s.warn}</strong><span>Needs attention</span></div><div><div class="jf-v4-kicker">Claims</div><strong>${s.claims}</strong><span>Pending requests</span></div>`;updateFleetState()}
            function addAttention(){if(!$('screen-dashboard')||$('jfV4Attention'))return;const a=document.createElement('section');a.id='jfV4Attention';a.className='jf-v4-attention';a.innerHTML='<h3>Attention required</h3><div class="jf-v4-attention-grid"></div>';const target=$('jfV4Summary');target?.after(a);renderAttention()}
            function renderAttention(){const host=document.querySelector('#jfV4Attention .jf-v4-attention-grid');if(!host)return;const rows=fleet().map(x=>({x,h:health4(x.v),s:state4(x.v)})).filter(x=>x.h.severity==='critical'||x.h.severity==='warning'||x.s.key==='offline').sort((a,b)=>(a.h.score??0)-(b.h.score??0)).slice(0,6);host.innerHTML=rows.length?rows.map(({x,h,s})=>`<button type="button" class="jf-v4-attention-card ${h.severity==='critical'?'critical':'warning'}" onclick="window.openVehicleFromDashboard?.(${x.c.id},'${esc4(x.v.id)}')"><div><b>${esc4(x.v.year)} ${esc4(x.v.make)} ${esc4(x.v.model)}</b><small>${esc4(x.c.name)} · ${h.reasons[0]||s.label}</small></div><div class="jf-v4-live ${s.key}"><i></i>${s.label}</div></button>`).join(''):'<div class="jf-empty" style="grid-column:1/-1"><strong>Nothing needs attention</strong>Fleet telemetry is currently within the configured demo limits.</div>'}
            function makePalette(){if($('jfV4Palette'))return;const o=document.createElement('div');o.id='jfV4Palette';o.className='jf-v4-palette';o.innerHTML='<div class="jf-v4-palette-card"><input id="jfV4Search" placeholder="Search JaFaFa…" autocomplete="off"><div id="jfV4Results" class="jf-v4-results"></div></div>';document.body.appendChild(o);const input=$('jfV4Search');function results(){const q=input.value.trim().toLowerCase();const base=[{label:'Open dashboard',hint:'Navigation',run:()=>window.showScreen?.('screen-dashboard')},{label:'Search customer',hint:'Navigation',run:()=>{window.showScreen?.('screen-customers');setTimeout(()=>$('customerSearchInput')?.focus(),50)}},{label:'Search vehicle',hint:'Navigation',run:()=>{window.showScreen?.('screen-vehicles');setTimeout(()=>$('vehicleSearchInput')?.focus(),50)}},{label:'Add customer',hint:'Action',run:()=>window.showScreen?.('screen-customers')},{label:'Open fleet',hint:'Navigation',run:()=>window.showScreen?.('screen-vehicles')},{label:'Open telemetry',hint:'Navigation',run:()=>window.showScreen?.('screen-telemetry')}];fleet().forEach(x=>{const name=`${x.v.year||''} ${x.v.make||''} ${x.v.model||''}`.trim(),meta=`${x.c.name||''} · ${x.v.plate||x.v.id||''}`;base.push({label:name,hint:meta,run:()=>window.openVehicleFromDashboard?.(x.c.id,x.v.id)})});const filtered=base.filter(x=>`${x.label} ${x.hint}`.toLowerCase().includes(q)).slice(0,12);$('jfV4Results').innerHTML=filtered.map((x,i)=>`<button class="jf-v4-result ${i===0?'active':''}" type="button"><span>${esc4(x.label)}</span><small>${esc4(x.hint)}</small></button>`).join('')||'<div class="jf-empty">No matches</div>';[...$('jfV4Results').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>{filtered[i].run();closePalette()})}
              function openPalette(){o.classList.add('open');input.value='';results();setTimeout(()=>input.focus(),30)}function closePalette(){o.classList.remove('open')}input.addEventListener('input',results);o.addEventListener('click',e=>{if(e.target===o)closePalette()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closePalette()});window.openJaFaFaPalette=openPalette}
            function makeNotifications(){if($('jfV4Notify'))return;const o=document.createElement('div');o.id='jfV4Notify';o.className='jf-v4-notify';o.innerHTML='<div class="jf-v4-notify-card"><div class="jf-v4-notify-head"><strong>Notifications</strong><button type="button" class="btn-secondary" id="jfV4NotifyClose">Close</button></div><div id="jfV4NotifyBody"></div></div>';document.body.appendChild(o);$('jfV4NotifyClose').onclick=()=>o.classList.remove('open');o.onclick=e=>{if(e.target===o)o.classList.remove('open')};window.openJaFaFaNotifications=()=>{renderNotifications();o.classList.add('open')};}
            function renderNotifications(){const host=$('jfV4NotifyBody');if(!host)return;const rows=[];fleet().forEach(x=>{const l=latest4(x.v.telemetry);const h=health4(x.v);if(h.severity==='critical')rows.push({kind:'critical',title:`${x.v.make} ${x.v.model} — critical`,body:h.reasons[0]||'Vehicle needs attention'});else if(h.severity==='warning')rows.push({kind:'warning',title:`${x.v.make} ${x.v.model} — warning`,body:h.reasons[0]||'Vehicle needs attention'});if(l&&state4(x.v).key==='offline')rows.push({kind:'warning',title:`${x.v.make} ${x.v.model} — telemetry offline`,body:`Last packet ${Math.round(state4(x.v).age/60)}m ago`})});host.innerHTML=rows.length?rows.slice(0,10).map(x=>`<div class="jf-v4-note ${x.kind}"><b>${esc4(x.title)}</b><small>${esc4(x.body)}</small></div>`).join(''):'<div class="jf-empty"><strong>All clear</strong>No active fleet notifications.</div>'}
            function addHeaderActions(){const host=document.querySelector('.user-pill')||document.querySelector('.userchip');if(!host||$('jfV4HeaderActions'))return;const wrap=document.createElement('div');wrap.id='jfV4HeaderActions';wrap.className='jf-v4-actions';wrap.innerHTML='<button type="button" id="jfV4NotifyBtn" aria-label="Notifications">🔔</button><button type="button" id="jfV4SystemBtn" aria-label="System status">● System</button><button type="button" id="jfV4PaletteBtn" aria-label="Command palette">⌘K</button>';host.parentNode.insertBefore(wrap,host);$('jfV4NotifyBtn').onclick=()=>window.openJaFaFaNotifications?.();$('jfV4PaletteBtn').onclick=()=>window.openJaFaFaPalette?.();$('jfV4SystemBtn').onclick=()=>{alert(`JaFaFa System Status\n\nDatabase: ${window.JaFaFaCore?'Operational':'Pending'}\nTelemetry: ${fleet().length?'Operational':'No data'}\nAuthentication: Browser prototype\nAlerts: Derived from telemetry\nSync: Demo/local state`)}}
            function persistFilters(){const ids=['minSpeed','metricType','engineStatus','startDate','startTime','timeRange'];ids.forEach(id=>{const e=$(id);if(!e)return;const k='jafafa-filter-'+id;const saved=sessionStorage.getItem(k);if(saved!==null)e.value=saved;e.addEventListener('change',()=>sessionStorage.setItem(k,e.value));e.addEventListener('input',()=>sessionStorage.setItem(k,e.value))})}
            function density(){const key='jafafa-density';const v=localStorage.getItem(key)||'comfortable';document.body.classList.remove('jf-density-compact','jf-density-dense');if(v!=='comfortable')document.body.classList.add('jf-density-'+v)}
            function addDensity(){const h=document.querySelector('.main-content');if(!h||$('jfV4Density'))return;const d=document.createElement('div');d.id='jfV4Density';d.className='jf-v4-actionbar';d.innerHTML='<span class="jf-v4-kicker">View density</span><div class="jf-v4-actions"><button data-density="comfortable">Comfortable</button><button data-density="compact">Compact</button><button data-density="dense">Dense</button></div>';h.prepend(d);d.querySelectorAll('[data-density]').forEach(b=>b.onclick=()=>{localStorage.setItem('jafafa-density',b.dataset.density);density();d.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});d.querySelector(`[data-density="${localStorage.getItem('jafafa-density')||'comfortable'}"]`)?.classList.add('active');density()}
            function protectForms(){document.addEventListener('submit',e=>{const form=e.target;if(!(form instanceof HTMLFormElement))return;const btn=form.querySelector('button[type="submit"],input[type="submit"]');if(!btn||btn.dataset.jfBusy)return;btn.dataset.jfBusy='1';btn.dataset.jfOriginal=btn.textContent;btn.disabled=true;if(btn.textContent)btn.textContent='Processing…';setTimeout(()=>{btn.disabled=false;delete btn.dataset.jfBusy;if(btn.dataset.jfOriginal)btn.textContent=btn.dataset.jfOriginal},1800)},true)}
            function mobileClose(){document.addEventListener('click',e=>{if(e.target.closest('[data-view]')||e.target.closest('[data-nav]'))document.querySelector('.jf-mobile-nav.open')?.classList.remove('open')},true)}
            function addCustomerUX(){if(!$('app'))return;const dash=$('dashboard');if(!dash)return;if(!$('jfV4CustomerSummary')){const hero=dash.querySelector('.hero');const s=document.createElement('div');s.id='jfV4CustomerSummary';s.className='jf-v4-customer-summary';(hero||dash.firstElementChild)?.after(s)}if(!$('jfV4Happening')){const h=document.createElement('div');h.id='jfV4Happening';h.className='jf-v4-happening';h.innerHTML='<h3>What\'s happening?</h3><div id="jfV4HappeningBody"></div>';$('jfV4CustomerSummary')?.after(h)}renderCustomerUX();}
            function renderCustomerUX(){const own=typeof ownedVehicles==='function'?ownedVehicles():[];const hs=own.map(health4),ss=own.map(state4),live=ss.filter(s=>s.key==='live'||s.key==='recent').length,alerts=hs.filter(h=>h.severity==='warning'||h.severity==='critical').length,score=hs.filter(h=>h.score!=null).length?Math.round(hs.filter(h=>h.score!=null).reduce((a,h)=>a+h.score,0)/hs.filter(h=>h.score!=null).length):0;const host=$('jfV4CustomerSummary');if(host)host.innerHTML=`<div><strong>${own.length}</strong><span>Vehicles</span></div><div><strong>${live}</strong><span>Live / recent</span></div><div><strong>${alerts}</strong><span>Attention</span></div><div><strong>${score||0}</strong><span>Fleet health</span></div>`;const body=$('jfV4HappeningBody');if(body){const notes=[];own.forEach(v=>{const h=health4(v),s=state4(v);if(s.key==='offline')notes.push(`<p class="warn">⚠ ${esc4(v.make)} ${esc4(v.model)} has no recent telemetry.</p>`);else if(h.severity==='critical')notes.push(`<p class="warn">🔴 ${esc4(v.make)} ${esc4(v.model)} needs attention: ${esc4(h.reasons[0])}.</p>`);else if(h.severity==='warning')notes.push(`<p class="warn">⚠ ${esc4(v.make)} ${esc4(v.model)}: ${esc4(h.reasons[0])}.</p>`);else notes.push(`<p>✓ ${esc4(v.make)} ${esc4(v.model)} is operating normally.</p>`)});body.innerHTML=notes.join('')||'<p>Your account is ready. Add or claim a vehicle to begin monitoring.</p>'}}
            function customerDeepLink(){if(!$('app')||typeof ownedVehicles!=='function')return;const id=new URLSearchParams(location.search).get('vehicle');if(!id)return;const v=ownedVehicles().find(x=>String(x.id)===String(id));if(v&&typeof openVehicle==='function')openVehicle(v.id);else{try{history.replaceState({},'',location.pathname)}catch{};window.toast?.('Vehicle unavailable');}}
            function patchCustomerProfile(){const f=$('profileForm');if(!f||f.__jfV4)return;f.__jfV4=true;f.addEventListener('submit',e=>{const email=$('profileEmail')?.value.trim().toLowerCase();if(!email||typeof customerByEmail!=='function')return;const clash=customerByEmail(email);if(clash&&String(clash.id)!==String(window.account?.id||'')){e.preventDefault();e.stopImmediatePropagation();window.toast?.('That email is already used by another customer account.');}},true)}
            function customerHealthPatch(){if(!$('app'))return;const oldRender=window.renderDetail;if(typeof oldRender==='function'&&!oldRender.__jfV4){window.renderDetail=function(){const r=oldRender.apply(this,arguments);setTimeout(()=>{const v=window.selected;if(!v)return;const h=health4(v);if($('detailHealth'))$('detailHealth').textContent=h.score==null?'—':h.score;if($('detailHealthLabel'))$('detailHealthLabel').textContent=h.score==null?'NO DATA':h.severity==='critical'?'CRITICAL':h.severity==='warning'?'ATTENTION':'GOOD';const host=$('healthBars');if(host)host.innerHTML=`<div class="jf-v4-health-explain"><strong>${h.score==null?'No recent telemetry':h.severity==='critical'?'Critical attention required':h.severity==='warning'?'Good — minor attention recommended':'Vehicle looks healthy'}</strong><span>${h.score==null?'The vehicle has not reported recently.':(h.reasons.length?'Why?':'All monitored demo signals are within range.')}</span><div class="jf-v4-health-reasons">${h.reasons.length?h.reasons.map(x=>`<i class="warn">⚠ ${esc4(x)}</i>`).join(''):'<i>✓ Engine temperature normal</i><i>✓ Telemetry connection stable</i>'}</div></div>`},0);return r};window.renderDetail.__jfV4=true}}
            function init(){addAdminSummary();addAttention();makePalette();makeNotifications();addHeaderActions();addDensity();persistFilters();protectForms();mobileClose();if($('app')){addCustomerUX();patchCustomerProfile();customerHealthPatch();customerDeepLink()}const oldRefresh=window.refreshAdminDashboard;if(typeof oldRefresh==='function'&&!oldRefresh.__jfV4){window.refreshAdminDashboard=async function(){const r=await oldRefresh.apply(this,arguments);renderAdminSummary();renderAttention();updateFleetState();return r};window.refreshAdminDashboard.__jfV4=true}const oldRenderDash=window.renderDashboard;if(typeof oldRenderDash==='function'&&!oldRenderDash.__jfV4){window.renderDashboard=function(){const r=oldRenderDash.apply(this,arguments);renderCustomerUX();return r};window.renderDashboard.__jfV4=true}renderAdminSummary();renderAttention();renderCustomerUX();updateFleetState();setInterval(()=>{renderAdminSummary();renderAttention();renderCustomerUX();updateFleetState()},5000)}
