name: Fix index CSS
on:
  push:
    paths:
      - '.jafafa-fix-css'
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = '@media(max-width:700px){.jf-fleet-command-grid{grid-template-columns:1fr 1fr}}</head>'
          good = '@media(max-width:700px){.jf-fleet-command-grid{grid-template-columns:1fr 1fr}}</style></head>'
          if bad not in s:
              raise SystemExit('Malformed style terminator not found')
          s = s.replace(bad, good, 1)
          s = re.sub(r'(?<!-webkit-)user-select:\s*([^;]+);', r'-webkit-user-select:\1;user-select:\1;', s)
          s = re.sub(r'(?<!-webkit-)backdrop-filter:\s*([^;]+);', r'-webkit-backdrop-filter:\1;backdrop-filter:\1;', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          rm -f .jafafa-fix-css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .jafafa-fix-css
          git commit -m 'Fix index CSS parser error and Safari compatibility' || exit 0
          git push
