name: Consolidate Scroll Animations

on:
  push:
    paths:
      - '.jafafa-scroll-animations'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject animation engine into index.html
        shell: python
        run: |
          from pathlib import Path
          index = Path('index.html')
          anim = Path('scroll-animations.js').read_text(encoding='utf-8')
          text = index.read_text(encoding='utf-8')
          marker = '</body>'
          if 'jf-scroll-engine-style' not in text:
              text = text.replace(marker, '<script>\n' + anim + '\n</script>\n' + marker, 1)
          index.write_text(text, encoding='utf-8')
      - name: Remove temporary animation files
        run: rm -f scroll-animations.js .jafafa-scroll-animations
      - name: Commit consolidated animation system
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scroll-animations.js .jafafa-scroll-animations
          git diff --cached --quiet && exit 0
          git commit -m 'Add immersive scroll construction animations'
          git push
