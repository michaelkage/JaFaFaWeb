name: Install JaFaFa customer portal v2
on:
  push:
    paths:
      - '.jafafa-customer-v2-trigger'
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject customer portal integration
        shell: python
        run: |
          from pathlib import Path
          p = Path('customer.html')
          text = p.read_text(encoding='utf-8')
          js = Path('jafafa-customer-v2.js').read_text(encoding='utf-8')
          marker = 'JaFaFa Customer Portal 2.0 — Plans 1–6.'
          if marker not in text:
              if '</body>' not in text:
                  raise SystemExit('No </body> tag found')
              text = text.replace('</body>', '<script>\n' + js + '\n</script>\n</body>', 1)
              p.write_text(text, encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          text = Path('customer.html').read_text(encoding='utf-8')
          required = ['JaFaFa Customer Portal 2.0','jafafa_fleet_suite_v3','jafafa_vehicle_claims_v1','jfCustomerOpen','Vehicle access']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          if text.count('<html') != 1 or text.count('</html>') != 1:
              raise SystemExit('Invalid html document boundary')
      - name: Remove temporary installer files
        run: rm -f jafafa-customer-v2.js .jafafa-customer-v2-trigger .github/workflows/install-customer-v2.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git rm -f jafafa-customer-v2.js .jafafa-customer-v2-trigger .github/workflows/install-customer-v2.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'Implement JaFaFa customer portal v2'
          git push
