name: Install customer activation UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add customer privacy layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="customer-activation-ui.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html customer-activation-ui.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Hide customer dongle identity fields'
          git push
