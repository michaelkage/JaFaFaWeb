name: Consolidate Pass A-C
on:
  push:
    paths:
      - 'pass-a-c-fixes.js'
      - '.jafafa-pass-ac'
permissions:
  contents: write
jobs:
  consolidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate into index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          js=Path('pass-a-c-fixes.js').read_text(encoding='utf-8')
          marker='/* JaFaFaWeb 2.0 — Pass A/B/C: telemetry correctness + UX + fleet command center. */'
          if marker not in text:
              if '</body>' not in text: raise SystemExit('index.html missing </body>')
              text=text.replace('</body>', '<script>\n'+js+'\n</script>\n</body>', 1)
              p.write_text(text,encoding='utf-8')
      - name: Remove temporary implementation files
        run: rm -f pass-a-c-fixes.js .jafafa-pass-ac .github/workflows/consolidate-pass-ac.yml
      - name: Commit consolidated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pass-a-c-fixes.js .jafafa-pass-ac .github/workflows/consolidate-pass-ac.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix telemetry architecture and polish fleet UX'
          git push
