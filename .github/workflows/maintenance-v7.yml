name: JaFaFa maintenance v7

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply maintenance pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def dedupe_css(path):
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(True)
              out=[]
              last=None
              for line in lines:
                  s=line.strip()
                  if s.startswith('-webkit-backdrop-filter:') or s.startswith('backdrop-filter:'):
                      if s == last:
                          continue
                      last=s
                  else:
                      last=None
                  out.append(line)
              path.write_text(''.join(out), encoding='utf-8')

          # ---------------- ADMIN ----------------
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          dedupe_css(p); t=p.read_text(encoding='utf-8')
          t=t.replace('a.connection === "online" || a.connection === "recent"','a.connection === "live" || a.connection === "recent"')
          t=t.replace('a.connection==="online"||a.connection==="recent"','a.connection==="live"||a.connection==="recent"')
          t=t.replace('a.connection==="online"?"Live telemetry"','a.connection==="live"?"Live telemetry"')
          t=t.replace("function connLabel(s){return s==='online'?'Online':s==='recent'?'Recently seen':'Offline'}","function connLabel(s){return ({live:'Live',recent:'Recently seen',stale:'Stale',offline:'Offline'})[s]||'Unknown'}")
          t=t.replace("function connClass(s){return s==='online'?'jf-ok':s==='recent'?'jf-warn':'jf-bad'}","function connClass(s){return ({live:'jf-ok',recent:'jf-info',stale:'jf-warn',offline:'jf-bad'})[s]||'jf-bad'}")
          t=t.replace('${online}<span>Live</span>','${live}<span>Live</span>')
          t=t.replace('const live = age < 120000;','const live = age < 10000;')
          t=t.replace('function renderFleetCommandCenter(vs){','function renderFleetCommandCenter(vs){')
          t=t.replace('const states=vs.map(v=>analyzeVehicleTelemetry(v.telemetry)),live=states.filter(a=>a.connection==="live").length','const states=vs.map(v=>analyzeVehicleTelemetry(v.telemetry)),live=states.filter(a=>a.connection==="live").length')
          t=t.replace('${online}</b><span>Live</span>','${live}</b><span>Live</span>')

          # Make the fleet suite expose the canonical state labels even if an older patch remains.
          t=t.replace("return s==='online'?'Online':s==='recent'?'Recently seen':'Offline'","return ({live:'Live',recent:'Recently seen',stale:'Stale',offline:'Offline'})[s]||'Unknown'")
          t=t.replace("return s==='online'?'jf-ok':s==='recent'?'jf-warn':'jf-bad'","return ({live:'jf-ok',recent:'jf-info',stale:'jf-warn',offline:'jf-bad'})[s]||'jf-bad'")

          # Replace the admin health-category implementation so missing telemetry is UNKNOWN.
          admin_cat='''function vehicleHealthCategories(logs){const latest=latestTelemetry(logs);if(!latest)return[];const n=normalizeTelemetryValue,coolant=n(latest.ctemp),voltage=n(latest.voltage),rpm=n(latest.rpm),speed=n(latest.speed),maf=n(latest.maf),iat=n(latest.iat),throttle=n(latest.throttle),load=n(latest.load),d=parseTime(latest.time),age=d?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),score=(v,ded=0)=>v===null?null:Math.max(0,Math.min(100,Math.round(v-ded))),engine=rpm===null?null:score(100,rpm>=TELEMETRY_CONFIG.rpm.warning?10:0),cooling=coolant===null?null:score(100,coolant>=TELEMETRY_CONFIG.ctemp.critical?30:coolant>=TELEMETRY_CONFIG.ctemp.warning?10:0),electrical=voltage===null||voltage<=0?null:score(100,voltage<TELEMETRY_CONFIG.voltage.warningBelow?20:0),air=(maf===null&&iat===null&&throttle===null&&load===null)?null:100,performance=speed===null?null:score(100,speed>=TELEMETRY_CONFIG.speed.warning?5:0),connectivity=connection==="live"?100:connection==="recent"?90:connection==="stale"?75:50;return [["Engine",engine],["Cooling",cooling],["Electrical",electrical],["Air / Intake",air],["Performance",performance],["Connectivity",connectivity]]}'''
          t=re.sub(r'function vehicleHealthCategories\(logs\)\{.*?\n',admin_cat+'\n',t,count=1)

          # Alert rules explicitly reject missing/non-finite values.
          t=t.replace('Number.isFinite(Number(l.ctemp))&&Number(l.ctemp)>=TELEMETRY_CONFIG.ctemp.critical','Number.isFinite(Number(l.ctemp))&&Number(l.ctemp)>=TELEMETRY_CONFIG.ctemp.critical')

          # Visible ownership-conflict panel with a real resolver backed by the fleet-suite local DB.
          if 'id="jfV7OwnershipPanel"' not in t:
              panel='''<script id="jafafa-v7-ownership-ui">\n(()=>{\nfunction escV(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\\"":"&quot;","'":"&#39;"}[m]||m))}\nfunction conflicts(){try{const d=JSON.parse(localStorage.getItem("jafafa_fleet_suite_v3")||"[]"),seen=new Map(),out=[];for(const c of d)for(const v of (c.cars||[])){const id=String(v.id||"");if(!id)continue;if(seen.has(id)&&seen.get(id).id!==c.id){const prior=seen.get(id);if(!out.some(x=>x.vehicleId===id))out.push({vehicleId:id,owners:[prior,c]})}else seen.set(id,c)}return out}catch{return[]}}\nfunction render(){let p=document.getElementById("jfV7OwnershipPanel");if(!p){p=document.createElement("section");p.id="jfV7OwnershipPanel";p.className="dashboard-section";const a=document.getElementById("jfFleetCommand")||document.getElementById("dashboardActivity")?.closest(".dashboard-section");if(a)a.parentNode.insertBefore(p,a)}if(!p)return;const xs=conflicts();p.hidden=!xs.length;if(!xs.length)return;p.innerHTML='<div class="jf-suite-card"><div class="jf-suite-head"><h3>⚠ Ownership conflicts</h3><span class="jf-chip jf-warn">'+xs.length+' unresolved</span></div>'+xs.map(x=>'<div class="jf-alert-row"><span class="jf-chip jf-bad">CONFLICT</span><div><strong>Vehicle '+escV(x.vehicleId)+'</strong><div class="jf-suite-small">'+x.owners.map(o=>escV(o.name||o.email||o.id)).join(' · ')+'</div><button class="btn-secondary jf-suite-small" type="button" data-jf-resolve="'+escV(x.vehicleId)+'">Resolve conflict</button></div></div>').join('')+'</div>';p.querySelectorAll('[data-jf-resolve]').forEach(b=>b.onclick=()=>resolve(b.dataset.jfResolve))}\nfunction resolve(id){try{const d=JSON.parse(localStorage.getItem("jafafa_fleet_suite_v3")||"[]"),owners=d.filter(c=>(c.cars||[]).some(v=>String(v.id)===String(id)));if(owners.length<2)return;const answer=prompt("Choose the owner by customer ID:\\n\\n"+owners.map(c=>c.id+" — "+c.name).join("\\n"));if(answer===null)return;const owner=owners.find(c=>String(c.id)===String(answer).trim());if(!owner){alert("Invalid customer ID.");return}let source=null;for(const c of owners){const hit=(c.cars||[]).find(v=>String(v.id)===String(id));if(hit&&!source)source={...hit};c.cars=(c.cars||[]).filter(v=>String(v.id)!==String(id));c.vehicleIds=(c.vehicleIds||[]).filter(v=>String(v)!==String(id))}if(!source)return;source.customerId=String(owner.id);source.ownershipConflict=false;delete source.ownershipConflictOwners;owner.cars=owner.cars||[];owner.vehicleIds=owner.vehicleIds||[];owner.cars.push(source);owner.vehicleIds.push(String(id));localStorage.setItem("jafafa_fleet_suite_v3",JSON.stringify(d));localStorage.setItem("jafafa_admin_role_v1",localStorage.getItem("jafafa_admin_role_v1")||"Super Admin");window.MOCK_DATABASE=d;render();if(typeof refreshAdminDashboard==='function')refreshAdminDashboard()}catch(e){console.error(e);alert("Could not resolve ownership conflict.")}}\nif(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>setTimeout(render,120));else setTimeout(render,120);window.addEventListener("jafafa:ownership-updated",render);\n})();\n</script>\n'''
              t=t.replace('</body>',panel+'</body>',1)
          p.write_text(t,encoding='utf-8')

          # ---------------- CUSTOMER ----------------
          p=Path('customer.html'); c=p.read_text(encoding='utf-8')
          dedupe_css(p); c=p.read_text(encoding='utf-8')
          c=c.replace('v.customerId = String(c.id); v.createdAt = v.createdAt || now();','v.customerId = v.customerId ? String(v.customerId) : String(c.id); v.createdAt = v.createdAt || now();',1)
          old='''function analyze(v) {\n         const t=latest(v), time=t ? new Date(t.time||t.timestamp) : null, age=time && !Number.isNaN(time.getTime()) ? Math.max(0,Date.now()-time.getTime()) : Infinity;\n         const connection=!t?"offline":age<=120000?"online":age<=900000?"recent":"offline";\n         if (window.analyzeVehicleTelemetry) return window.analyzeVehicleTelemetry(v.telemetry||[]);\n         const coolant=num(t?.ctemp ?? t?.coolant), voltage=num(t?.voltage), rpm=num(t?.rpm), speed=num(t?.speed);\n         const overall=(coolant!==null&&coolant>110)||(voltage!==null&&voltage<11.5)?"critical":connection==="offline"||(coolant!==null&&coolant>=105)||(voltage!==null&&voltage<12)||(rpm!==null&&rpm>5000)?"warning":"healthy";\n         return {latest:t,connection,cooling:coolant===null?"unknown":coolant>110?"overheating":coolant>=105?"warm":"normal",electrical:voltage===null?"unknown":voltage<12?"low-voltage":"normal",overall,age};\n       }'''
          new='''function analyze(v) {\n         if (window.analyzeVehicleTelemetry) return window.analyzeVehicleTelemetry(v?.telemetry || []);\n         return {latest:latest(v),connection:"offline",engine:"unknown",driving:"unknown",cooling:"unknown",electrical:"unknown",overall:"warning",age:Infinity,score:null,categories:[]};\n       }'''
          c=c.replace(old,new,1)
          c=re.sub(r'function vehicleHealthCategories\(logs\)\{.*?\n', '''function vehicleHealthCategories(logs){const latest=latestTelemetry(logs);if(!latest)return[];const n=normalizeTelemetryValue,coolant=n(latest.ctemp),voltage=n(latest.voltage),rpm=n(latest.rpm),speed=n(latest.speed),maf=n(latest.maf),iat=n(latest.iat),throttle=n(latest.throttle),load=n(latest.load),d=latest.time||latest.timestamp?new Date(latest.time||latest.timestamp):null,age=d&&!Number.isNaN(d.getTime())?Math.max(0,Date.now()-d.getTime()):Infinity,connection=telemetryConnectionState(age),score=(v,ded=0)=>v===null?null:Math.max(0,Math.min(100,Math.round(v-ded))),engine=rpm===null?null:score(100,rpm>=TELEMETRY_CONFIG.rpm.warning?10:0),cooling=coolant===null?null:score(100,coolant>=TELEMETRY_CONFIG.ctemp.critical?30:coolant>=TELEMETRY_CONFIG.ctemp.warning?10:0),electrical=voltage===null||voltage<=0?null:score(100,voltage<TELEMETRY_CONFIG.voltage.warningBelow?20:0),air=(maf===null&&iat===null&&throttle===null&&load===null)?null:100,performance=speed===null?null:score(100,speed>=TELEMETRY_CONFIG.speed.warning?5:0),connectivity=connection==="live"?100:connection==="recent"?90:connection==="stale"?75:50;return [["Engine",engine],["Cooling",cooling],["Electrical",electrical],["Air / Intake",air],["Performance",performance],["Connectivity",connectivity]]}\n''',c,count=1)
          c=c.replace('$("healthBars").innerHTML=healthCategories(v).map(x=>`<div class="barrow"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:${x[1]}%"></div></div><b>${x[1]}</b></div>`).join("");','$("healthBars").innerHTML=healthCategories(v).map(x=>{const known=Number.isFinite(x[1]);return `<div class="barrow"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:${known?x[1]:0}%"></div></div><b>${known?x[1]:"UNKNOWN"}</b></div>`}).join("");')
          c=c.replace('const online=vs.filter(v=>analyze(v).connection==="live").length, warnings=vs.filter(v=>analyze(v).connection==="recent").length, offline=vs.filter(v=>analyze(v).connection==="offline").length;','const online=vs.filter(v=>analyze(v).connection==="live").length, recent=vs.filter(v=>analyze(v).connection==="recent").length, offline=vs.filter(v=>analyze(v).connection==="offline").length, warnings=vs.filter(v=>analyze(v).overall==="warning").length, critical=vs.filter(v=>analyze(v).overall==="critical").length;')
          c=c.replace('$("statVehicles").textContent=vs.length; $("statOnline").textContent=online; $("statWarnings").textContent=warnings; $("statOffline").textContent=offline;','$("statVehicles").textContent=vs.length; $("statOnline").textContent=online; $("statWarnings").textContent=warnings+critical; $("statOffline").textContent=offline;')
          p.write_text(c,encoding='utf-8')
          print('maintenance pass complete')
          PY

      - name: Validate files
        run: |
          python - <<'PY'
          from pathlib import Path
          for n in ('index.html','customer.html'):
              s=Path(n).read_text(encoding='utf-8')
              assert s.count('<html')==1 and s.count('</html>')==1, n+' html structure'
              assert s.count('<style')==s.count('</style>'), n+' style balance'
              assert s.count('<script')==s.count('</script>'), n+' script balance'
              print(n,'OK')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html customer.html
          git diff --cached --quiet || git commit -m 'fix: consolidate telemetry and ownership semantics [skip jafafa-maintenance]'
          git push
