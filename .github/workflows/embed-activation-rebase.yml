name: Embed activation rebase

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jafafa-activation-embed
  cancel-in-progress: true

jobs:
  embed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inline activation layer
        shell: python
        run: |
          from pathlib import Path
          import re

          js_path = Path('activation-codes.js')
          if not js_path.exists():
              print('activation-codes.js is already consolidated; nothing to do.')
              raise SystemExit(0)

          js = js_path.read_text(encoding='utf-8')
          marker = '<!-- JAFAFA ACTIVATION CODE LAYER -->'

          for name in ('index.html', 'customer.html', 'indexboring.html', 'customerboring.html'):
              p = Path(name)
              if not p.exists():
                  print(f'Skipping missing {name}')
                  continue

              s = p.read_text(encoding='utf-8')

              # Remove any external activation layer reference.
              s = re.sub(
                  r'\s*<script\s+src=["\']activation-codes\.js["\']\s*></script>',
                  '',
                  s,
                  flags=re.I,
              )

              # Replace an existing inline layer so repeated workflow runs are idempotent.
              pattern = re.compile(
                  re.escape(marker) + r'\s*<script>.*?</script>',
                  flags=re.I | re.S,
              )
              inline = marker + '\n<script>\n' + js + '\n</script>'

              if pattern.search(s):
                  s = pattern.sub(inline, s, count=1)
              else:
                  if '</body>' not in s.lower():
                      raise RuntimeError(f'{name} has no closing body tag')
                  s = re.sub(r'</body>', inline + '\n</body>', s, count=1, flags=re.I)

              p.write_text(s, encoding='utf-8')
              print(f'Inlined activation layer into {name}')

          js_path.unlink()
          print('Removed activation-codes.js')

      - name: Validate HTML JavaScript blocks
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          for name in ('index.html', 'customer.html', 'indexboring.html', 'customerboring.html'):
              text = Path(name).read_text(encoding='utf-8')
              blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.I | re.S)
              for i, block in enumerate(blocks, 1):
                  tmp = Path(f'/tmp/{name}.{i}.js')
                  tmp.write_text(block, encoding='utf-8')
                  result = subprocess.run(['node', '--check', str(tmp)], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'JavaScript syntax error in {name}, script block {i}')
              print(f'Validated {name}')

      - name: Commit and push with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidate activation code layer into HTML'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard origin/main; exit 1; }
            if git push origin HEAD:main; then
              echo 'Push succeeded.'
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Unable to push activation consolidation after retries.'
          exit 1
