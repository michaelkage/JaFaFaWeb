name: Agent fix customer Google client ID

on:
  push:
    branches:
      - agent/fix-customer-google-client-id

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix customer Google client ID initialization
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("customerboring.html")
          s = p.read_text(encoding="utf-8")

          client_id = '618464687927-3qhsv0r9012cn0e50g963vk4n71pb54r.apps.googleusercontent.com'
          declaration = f'const GOOGLE_CLIENT_ID = "{client_id}";'

          # Remove any existing declarations so there is exactly one.
          s = re.sub(r'\\s*const\\s+GOOGLE_CLIENT_ID\\s*=\\s*["\\\'][^"\\\']+["\\\'];?', '', s)

          # Put the declaration before the initializer function. This avoids
          # temporal-dead-zone/order problems when the Google script invokes
          # the initializer as soon as it loads.
          marker = 'function initCustomerGoogleAuth() {'
          if marker not in s:
              raise SystemExit("Could not find initCustomerGoogleAuth()")

          s = s.replace(marker, declaration + "\\n        " + marker, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customerboring.html
          if git diff --cached --quiet; then
            echo "No customer Google client ID change was necessary."
            exit 0
          fi
          git commit -m "fix customer Google client ID initialization"
          git push
